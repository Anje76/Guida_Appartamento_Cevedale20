<style>
  :root{
    --cream:#F5EEDF;
    --panel:#FCF8EF;
    --forest:#33513A;
    --forest-dk:#233A29;
    --forest-lt:#4E6D53;
    --gold:#E3A53A;
    --gold-dk:#C7862A;
    --clay:#A8633D;
    --clay-dk:#8B4E2E;
    --ink:#2A2420;
    --ink-soft:#5B5346;
    --line:#E1D5B8;
    --line-soft:#EBE1CB;
    --danger:#B4482F;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow:0 10px 30px -12px rgba(43,36,25,.25);
    --shadow-sm:0 4px 14px -6px rgba(43,36,25,.2);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -10%, #FFFDF6 0%, var(--cream) 55%),
      var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Baloo 2',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- App shell ---------- */
  .app{max-width:560px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:40px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 6px;
  }
  .brand{display:flex; align-items:center; gap:9px;}
  .brand-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 3px rgba(227,165,58,.25);
  }
  .brand-name{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; letter-spacing:.02em; color:var(--forest-dk);}

  .langbar{display:flex; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px;}
  .langbar button{
    border:none; background:transparent; padding:6px 11px; border-radius:999px;
    font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; letter-spacing:.03em;
  }
  .langbar button.active{background:var(--forest); color:#fff;}

  /* ---------- Hero ---------- */
  .hero{padding:10px 20px 6px; text-align:center;}
  .hero-logo{width:112px; height:auto; margin:6px auto 2px; display:block; filter:drop-shadow(0 8px 16px rgba(43,36,25,.18));}
  .ridge{
    width:100%; height:34px; margin:6px 0 2px;
  }
  .hero h1{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; margin:2px 0 4px; color:var(--forest-dk);
    letter-spacing:.01em;
  }
  .hero p{margin:0; color:var(--ink-soft); font-size:14.5px; line-height:1.5; padding:0 6px;}

  .tap-hint{
    text-align:center; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--forest-lt); font-weight:700; margin:22px 0 12px;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    padding:0 16px 10px;
  }
  @media (min-width:460px){ .grid{grid-template-columns:repeat(3,1fr);} }
  .tile{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius-md);
    padding:16px 8px 12px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; text-align:center;
    box-shadow:var(--shadow-sm);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .tile:active{transform:scale(.96);}
  .tile:hover{border-color:var(--gold); box-shadow:0 10px 22px -10px rgba(227,165,58,.45);}
  .tile-icon{
    width:44px; height:44px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#EFE3C6,#E7D6AE);
    color:var(--forest-dk);
  }
  .tile-icon svg{width:23px; height:23px;}
  .tile-label{font-size:11.5px; font-weight:700; color:var(--ink); line-height:1.25;}

  /* ---------- Footer / contact CTA ---------- */
  .cta-wrap{padding:8px 16px 0;}
  .cta{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--forest); color:#fff; border:none;
    padding:15px; border-radius:999px; width:100%;
    font-weight:700; font-size:14.5px; letter-spacing:.02em; cursor:pointer;
    box-shadow:0 12px 24px -10px rgba(51,81,58,.55);
  }
  .cta svg{width:17px;height:17px;}

  .hostline{text-align:center; font-size:12px; color:var(--ink-soft); margin-top:16px;}
  .hostline b{color:var(--forest-dk);}

  /* ---------- Detail sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(35,29,22,.42);
    opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:40;
  }
  .sheet-overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:560px;
    background:var(--cream);
    border-radius:26px 26px 0 0;
    max-height:92vh; overflow:hidden;
    display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 -20px 50px -10px rgba(20,16,10,.4);
    z-index:41;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-grabber{width:38px; height:4px; background:var(--line); border-radius:99px; margin:10px auto 0;}
  .sheet-head{
    display:flex; align-items:center; gap:12px; padding:12px 18px 12px;
    border-bottom:1px solid var(--line-soft);
  }
  .sheet-head .icon{
    width:38px; height:38px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#EFE3C6,#E7D6AE); color:var(--forest-dk);
  }
  .sheet-head .icon svg{width:20px;height:20px;}
  .sheet-head h2{font-family:'Baloo 2',sans-serif; font-size:18.5px; margin:0; color:var(--forest-dk);}
  .sheet-close{
    margin-left:auto; border:none; background:var(--panel); border:1px solid var(--line);
    width:32px; height:32px; border-radius:50%; cursor:pointer; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .sheet-body{padding:16px 18px 30px; overflow-y:auto;}

  /* content blocks */
  .b-p{font-size:14.5px; line-height:1.6; color:var(--ink); margin:0 0 12px;}
  .b-h{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; color:var(--forest-dk); margin:18px 0 8px; display:flex; align-items:center; gap:7px;}
  .b-h:first-child{margin-top:2px;}
  .b-h .mtick{width:14px;height:10px; flex:none;}
  .b-list{margin:0 0 14px; padding:0; list-style:none;}
  .b-list li{
    font-size:14.5px; line-height:1.55; color:var(--ink); margin-bottom:8px; padding-left:20px; position:relative;
  }
  .b-list li:before{
    content:""; position:absolute; left:0; top:8px; width:7px; height:7px; border-radius:2px;
    background:var(--gold); transform:rotate(45deg);
  }
  .b-note{
    background:#FBF1DA; border:1px solid #EBD6A0; border-left:4px solid var(--gold-dk);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:13.8px; line-height:1.55; margin:0 0 14px; color:var(--ink);
  }
  .b-warn{
    background:#FCEBE4; border:1px solid #EFC1AE; border-left:4px solid var(--danger);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:13.8px; line-height:1.55; margin:0 0 14px; color:#6E2A16;
  }
  .b-ph{
    border:1.5px dashed #C9BB98; border-radius:var(--radius-sm); padding:12px 14px; margin:0 0 14px;
    font-size:13px; line-height:1.5; color:var(--ink-soft); background:rgba(255,255,255,.4);
  }
  .b-ph b{color:var(--clay-dk);}
  .b-link{
    display:flex; align-items:center; gap:10px; text-decoration:none;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 14px; margin:0 0 10px; font-size:14px; font-weight:600; color:var(--forest-dk);
  }
  .b-link svg{width:17px;height:17px; flex:none; color:var(--gold-dk);}
  .b-link .arrow{margin-left:auto; width:14px;height:14px; color:var(--ink-soft);}
  .b-code{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--forest-dk); color:#fff; border-radius:var(--radius-sm); padding:13px 14px; margin:0 0 14px;
  }
  .b-code .lbl{font-size:11.5px; opacity:.75; text-transform:uppercase; letter-spacing:.08em; margin-bottom:3px;}
  .b-code .val{font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:700; letter-spacing:.04em;}
  .b-code button{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff;
    border-radius:8px; padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer; flex:none;
  }
  .b-contact{
    display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:12px 14px; margin:0 0 10px;
  }
  .b-contact .av{
    width:38px;height:38px;border-radius:50%; background:linear-gradient(160deg,var(--forest-lt),var(--forest-dk));
    color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Baloo 2'; flex:none;
  }
  .b-contact .info{flex:1; min-width:0;}
  .b-contact .name{font-weight:700; font-size:14px; color:var(--ink);}
  .b-contact .sub{font-size:12.5px; color:var(--ink-soft);}
  .b-contact .acts{display:flex; gap:6px; flex:none;}
  .b-contact .acts a{
    width:32px;height:32px; border-radius:50%; background:var(--forest); color:#fff;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
  }
  .b-contact .acts a svg{width:15px;height:15px;}
  .b-hours{width:100%; border-collapse:collapse; margin:0 0 14px; font-size:13.5px;}
  .b-hours td{padding:6px 4px; border-bottom:1px solid var(--line-soft);}
  .b-hours td:first-child{font-weight:600; color:var(--forest-dk);}
  .b-hours td:last-child{text-align:right; color:var(--ink-soft);}
  .b-weather{
    background:linear-gradient(160deg,var(--forest),var(--forest-dk)); color:#fff; border-radius:var(--radius-md);
    padding:18px; margin:0 0 14px;
  }
  .b-weather .row{display:flex; align-items:center; justify-content:space-between;}
  .b-weather .temp{font-family:'Baloo 2'; font-size:38px; font-weight:700;}
  .b-weather .loc{font-size:13px; opacity:.85;}
  .b-weather .days{display:flex; justify-content:space-between; margin-top:14px; gap:6px;}
  .b-weather .day{text-align:center; font-size:11.5px; opacity:.9; flex:1;}
  .b-weather .day b{display:block; font-size:14px; margin-top:2px;}

  .b-form textarea, .b-form input{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 12px;
    font-family:inherit; font-size:14px; margin-bottom:10px; background:var(--panel); color:var(--ink);
  }
  .b-form label{font-size:12.5px; font-weight:700; color:var(--forest-dk); display:block; margin-bottom:5px;}
  .b-form button{
    width:100%; background:var(--clay); color:#fff; border:none; border-radius:999px; padding:13px;
    font-weight:700; font-size:14px; cursor:pointer;
  }

  .divider{
    height:1px; background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px); margin:18px 0;
  }

  ::-webkit-scrollbar{width:0;}
  :focus-visible{outline:2.5px solid var(--gold-dk); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>

/* =========================================================
   RENDER
   ========================================================= */
let lang = (navigator.language||'it').slice(0,2)==='en' ? 'en' : 'it';

function initLangBar(){
  const bar=document.getElementById('langbar');
  bar.innerHTML='';
  LANGS.forEach(l=>{
    const b=document.createElement('button');
    b.textContent=l.label;
    b.className = l.code===lang ? 'active':'';
    b.onclick=()=>{ lang=l.code; renderAll(); };
    bar.appendChild(b);
  });
}

function renderHome(){
  const d=DATA[lang];
  document.documentElement.lang=lang;
  document.getElementById('t-title').textContent=d.title;
  document.getElementById('t-subtitle').textContent=d.subtitle;
  document.getElementById('t-hint').textContent=d.hint;
  document.getElementById('t-cta').textContent=d.cta;
  document.getElementById('t-hostline').innerHTML=d.hostline;

  const grid=document.getElementById('grid');
  grid.innerHTML='';
  d.nav.forEach(item=>{
    const tile=document.createElement('button');
    tile.className='tile';
    tile.setAttribute('aria-label', item.label);
    tile.innerHTML=`<span class="tile-icon">${icon(item.icon)}</span><span class="tile-label">${item.label}</span>`;
    tile.onclick=()=>openSection(item.id);
    grid.appendChild(tile);
  });
}

function blockHTML(b){
  switch(b.t){
    case 'p': return `<p class="b-p">${b.text}</p>`;
    case 'h': return `<div class="b-h">${MTICK}${b.text}</div>`;
    case 'list': return `<ul class="b-list">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'note': return `<div class="b-note">${b.text}</div>`;
    case 'warn': return `<div class="b-warn">${b.text}</div>`;
    case 'ph': return `<div class="b-ph">${b.text}</div>`;
    case 'link': return `<a class="b-link" href="${b.url}" target="_blank" rel="noopener">${icon(b.icon||'pin')}<span>${b.label}</span><span class="arrow">${icon('arrow')}</span></a>`;
    case 'code': return `<div class="b-code"><div><div class="lbl">${b.label}</div><div class="val" id="code-${cid()}">${b.value}</div></div>${b.value.match(/^[A-Za-z0-9•\-]+$/)? '' : ''}</div>`;
    case 'contact': return `<div class="b-contact">
        <div class="av">${b.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
        <div class="info"><div class="name">${b.name}</div><div class="sub">${b.sub}</div></div>
        <div class="acts">
          <a href="tel:${b.phone}" aria-label="call">${icon('phone')}</a>
          <a href="mailto:${b.email}" aria-label="email">${icon('mail')}</a>
        </div>
      </div>`;
    case 'hours': return `<table class="b-hours">${b.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    case 'weather': return `<div class="b-weather" id="weatherBox">
        <div class="row"><div><div class="loc">Malè, Val di Sole</div><div class="temp" id="wTemp">—</div></div><div id="wIcon" style="width:46px;height:46px;">${icon('cloud')}</div></div>
        <div class="days" id="wDays"></div>
      </div>`;
    case 'form': return `<div class="b-form">
        <label>${lang==='it'?'Il tuo nome':'Your name'}</label>
        <input id="fbName" type="text" placeholder="${lang==='it'?'Nome':'Name'}">
        <label>${lang==='it'?'Messaggio':'Message'}</label>
        <textarea id="fbMsg" rows="4" placeholder="${lang==='it'?'Scrivici qui...':'Write to us here...'}"></textarea>
        <button id="fbSend" type="button">${lang==='it'?'Invia via email':'Send via email'}</button>
      </div>`;
    default: return '';
  }
}
let _cid=0; function cid(){ return ++_cid; }

function openSection(id){
  const d=DATA[lang];
  const nav=d.nav.find(n=>n.id===id);
  const sec=d.sections[id];
  document.getElementById('sheetIcon').innerHTML=icon(nav.icon);
  document.getElementById('sheetTitle').textContent=sec.title;
  document.getElementById('sheetBody').innerHTML=sec.blocks.map(blockHTML).join('');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.body.style.overflow='hidden';
  location.hash = id;

  // wire dynamic bits
  const sendBtn=document.getElementById('fbSend');
  if(sendBtn){
    sendBtn.onclick=()=>{
      const name=document.getElementById('fbName').value||'';
      const msg=document.getElementById('fbMsg').value||'';
      const subject=encodeURIComponent('Cevedale 20 — feedback');
      const body=encodeURIComponent(`${name}\n\n${msg}`);
      window.location.href=`mailto:anje76@gmail.com?subject=${subject}&body=${body}`;
    };
  }
  if(document.getElementById('weatherBox')) loadWeather();
}

function closeSection(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow='';
  history.replaceState(null,'',location.pathname+location.search);
}

function renderAll(){
  initLangBar();
  renderHome();
}

document.getElementById('overlay').onclick=closeSection;
document.getElementById('sheetClose').onclick=closeSection;
document.getElementById('ctaContact').onclick=()=>openSection('contacts');

renderAll();
if(location.hash){ const id=location.hash.slice(1); if(DATA[lang].sections[id]) setTimeout(()=>openSection(id),50); }

/* =========================================================
   WEATHER (Open-Meteo, no API key required)
   ========================================================= */
let weatherLoaded=false;
async function loadWeather(){
  const tEl=document.getElementById('wTemp');
  const daysEl=document.getElementById('wDays');
  try{
    const res=await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.357&longitude=10.918&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FRome&forecast_days=4');
    const j=await res.json();
    tEl.textContent = Math.round(j.current.temperature_2m)+'°C';
    const names = lang==='it' ? ['Oggi','Dom1','Dom2','Dom3'] : ['Today','Day 2','Day 3','Day 4'];
    const daysArr = j.daily.time.map((t,i)=>i);
    const labels = j.daily.time.map((t,i)=> i===0 ? (lang==='it'?'Oggi':'Today') : new Date(t).toLocaleDateString(lang==='it'?'it-IT':'en-GB',{weekday:'short'}));
    daysEl.innerHTML = daysArr.map(i=>`<div class="day">${labels[i]}<b>${Math.round(j.daily.temperature_2m_max[i])}°</b></div>`).join('');
  }catch(e){
    tEl.textContent='—';
    daysEl.innerHTML=`<div class="day">${lang==='it'?'Meteo non disponibile':'Weather unavailable'}</div>`;
  }
}

/* copy-to-clipboard for any future code chip with a value that's an actual code */
document.addEventListener('click', (e)=>{
  const btn=e.target.closest('[data-copy]');
  if(!btn) return;
  navigator.clipboard.writeText(btn.dataset.copy);
});
