let lang = (()=>{ const c=(navigator.language||'it').slice(0,2); return ['en','de','fr','es'].includes(c) ? c : 'it'; })();

function initLangBar(){
  const bar=document.getElementById('langbar');
  bar.innerHTML='';
  LANGS.forEach(l=>{
    const b=document.createElement('button');
    b.innerHTML=l.flag;
    b.className = l.code===lang ? 'active':'';
    b.setAttribute('aria-label', l.name);
    b.title = l.name;
    b.onclick=()=>{ lang=l.code; renderAll(); };
    bar.appendChild(b);
  });
}

function renderHome(){
  const d=DATA[lang];
  document.documentElement.lang=lang;
  document.getElementById('t-title').textContent=d.title;
  document.getElementById('t-subtitle').textContent=d.subtitle;
  document.getElementById('t-hint').textContent=d.hint;
  document.getElementById('t-cta').textContent=d.cta;
  document.getElementById('t-hostline').innerHTML=d.hostline;
  document.getElementById('t-essentialLabel').textContent=d.essentialLabel;
  document.getElementById('t-usefulLabel').textContent=d.usefulLabel;

  const ESSENTIAL_COUNT=6;
  const gridEssential=document.getElementById('gridEssential');
  const gridUseful=document.getElementById('gridUseful');
  gridEssential.innerHTML='';
  gridUseful.innerHTML='';
  d.nav.forEach((item,i)=>{
    const isEssential=i<ESSENTIAL_COUNT;
    const tile=document.createElement('button');
    tile.className='tile'+(isEssential?' tile-essential':'');
    tile.setAttribute('aria-label', item.label);
    tile.innerHTML=`${item.beta?'<span class="tile-beta">BETA</span>':''}<span class="tile-icon">${icon(item.icon)}</span><span class="tile-label">${item.label}</span>`;
    tile.onclick=()=>openSection(item.id);
    (isEssential?gridEssential:gridUseful).appendChild(tile);
  });
}

function blockHTML(b){
  switch(b.t){
    case 'p': return `<p class="b-p">${b.text}</p>`;
    case 'h': return `<div class="b-h"${b.id?` id="${b.id}"`:''}>${MTICK}${b.text}</div>`;
    case 'list': return `<ul class="b-list">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'note': return `<div class="b-note">${b.text}</div>`;
    case 'warn': return `<div class="b-warn">${b.text}</div>`;
    case 'ph': return `<div class="b-ph">${b.text}</div>`;
    case 'link': return `<a class="b-link" href="${b.url}" target="_blank" rel="noopener">${icon(b.icon||'pin')}<span>${b.label}</span><span class="arrow">${icon('arrow')}</span></a>`;
    case 'jump': return `<a class="b-link" href="#${b.to}" onclick="event.preventDefault(); openSection('${b.to}'${b.anchor?`,'${b.anchor}'`:''});">${icon(b.icon||'pin')}<span>${b.label}</span><span class="arrow">${icon('arrow')}</span></a>`;
    case 'jumpCard': return `<a class="b-place b-place-link" href="#${b.to}" onclick="event.preventDefault(); openSection('${b.to}'${b.anchor?`,'${b.anchor}'`:''});">
        ${b.img?`<img class="pl-photo" src="${b.img}" alt="${b.name}" loading="lazy">`:''}
        <div class="pl-body">
          <div class="pl-name">${b.name}</div>
          ${b.desc?`<div class="pl-desc">${b.desc}</div>`:''}
          <div class="pl-cta">${icon('arrow')}<span>${b.cta||'Scopri di più'}</span></div>
        </div>
      </a>`;
    case 'img': return `<div class="b-img"${b.center?' style="text-align:center"':''}><img src="${b.src}" alt="${b.alt||''}" loading="lazy"${b.width?` style="width:${b.width};display:inline-block;"`:''}>${b.caption? `<div class="cap">${b.caption}</div>`:''}</div>`;
    case 'mapembed': return `<div class="b-map"><iframe src="https://www.google.com/maps?q=${encodeURIComponent(b.query)}&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>`;
    case 'brand': return `<a class="b-brand" href="${b.url}" target="_blank" rel="noopener"><div class="logostrip"><img src="${b.logo}" alt="${b.name}" loading="lazy"></div><div class="row"><span class="tag">${b.tagline}</span><span class="arrow">${icon('arrow')}</span></div></a>`;
    case 'steps': return `<div class="b-steps">${b.items.map(s=>`<div class="b-step${s.alt?' alt':''}"><div class="num">${s.num}</div><div class="body">${s.title?`<div class="st-title">${s.title}</div>`:''}<div class="st-text">${s.text}</div></div></div>`).join('')}</div>`;
    case 'place': return `<div class="b-place"${b.id?` id="${b.id}"`:''}>
        ${b.logoFull?`<div class="pl-logofull"><img src="${b.logoFull}" alt="${b.name}" loading="lazy"></div>`:(b.logo?`<div class="pl-logostrip"><img src="${b.logo}" alt="${b.name}" loading="lazy"></div>`:(b.img?`<img class="pl-photo" src="${b.img}" alt="${b.name}" loading="lazy">`:''))}
        <div class="pl-body">
        ${(b.tag||b.distance)?`<div class="pl-top">${b.tag?`<span class="pl-tag">${b.tag}</span>`:'<span></span>'}${b.distance?`<span class="pl-dist">${b.distance}</span>`:''}</div>`:''}
        <div class="pl-name">${b.name}</div>
        <div class="pl-addr">${b.address}</div>
        <div class="pl-desc">${b.desc}</div>
        ${b.hours?`<table class="pl-hours">${b.hours.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`:''}
        <div class="pl-actions">
          ${b.url?`<a href="${b.url}" target="_blank" rel="noopener">${icon('globe')}<span>${b.urlLabel||'Sito'}</span></a>`:''}
          ${b.mapsQuery?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.mapsQuery)}" target="_blank" rel="noopener">${icon('pin')}<span>${b.mapsLabel||'Mappa'}</span></a>`:''}
          ${b.phone?`<a href="tel:${b.phone}">${icon('phone')}<span>${b.phoneDisplay||b.phone}</span></a>`:''}
          ${b.email?`<a href="mailto:${b.email}">${icon('mail')}<span>${b.emailLabel||b.email}</span></a>`:''}
        </div>
        </div>
      </div>`;
    case 'code': return `<div class="b-code"><div><div class="lbl">${b.label}</div><div class="val" id="code-${cid()}">${b.value}</div></div>${b.value.match(/^[A-Za-z0-9•\-]+$/)? '' : ''}</div>`;
    case 'contact': return `<div class="b-contact">
        <div class="av">${b.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
        <div class="info"><div class="name">${b.name}</div><div class="sub">${b.sub}</div></div>
        <div class="acts">
          ${b.phone?`<a href="tel:${b.phone}" aria-label="call">${icon('phone')}</a>`:''}
          ${b.email?`<a href="mailto:${b.email}" aria-label="email">${icon('mail')}</a>`:''}
        </div>
      </div>`;
    case 'hours': return `<table class="b-hours">${b.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    case 'weather': return `<div class="b-weather" id="weatherBox">
        <div class="wloc-tabs" id="wLocTabs">${WEATHER_LOCATIONS.map((loc,i)=>`<button class="wloc-tab${i===weatherLocIndex?' active':''}" data-idx="${i}" type="button">${loc.tabLabel[lang]}</button>`).join('')}</div>
        <div class="row"><div><div class="loc" id="wLocName">${WEATHER_LOCATIONS[weatherLocIndex].name[lang]}</div><div class="temp" id="wTemp">—</div></div><div id="wIcon" style="width:46px;height:46px;">${icon('cloud')}</div></div>
        <div class="wslots" id="wSlots"></div>
        <div class="days" id="wDays"></div>
      </div>`;
    case 'events_today': return `<div class="b-events" id="eventsTodayBox">
        <div class="events-loading">${icon('calendar')}<span>${lang==='it'?'Carico gli eventi di oggi…':'Loading today’s events…'}</span></div>
      </div>`;
    case 'form': return `<div class="b-form">
        <label>${lang==='it'?'Il tuo nome':'Your name'}</label>
        <input id="fbName" type="text" placeholder="${lang==='it'?'Nome':'Name'}">
        <label>${lang==='it'?'Messaggio':'Message'}</label>
        <textarea id="fbMsg" rows="4" placeholder="${lang==='it'?'Scrivici qui...':'Write to us here...'}"></textarea>
        <button id="fbSend" type="button">${lang==='it'?'Invia via email':'Send via email'}</button>
      </div>`;
    default: return '';
  }
}
let _cid=0; function cid(){ return ++_cid; }

function openSection(id, anchor){
  const d=DATA[lang];
  const nav=d.nav.find(n=>n.id===id);
  const sec=d.sections[id];
  document.getElementById('sheetIcon').innerHTML=icon(nav?nav.icon:'info');
  document.getElementById('sheetTitle').innerHTML=sec.title+((nav&&nav.beta)?'<span class="beta-badge">BETA</span>':'');
  const body=document.getElementById('sheetBody');
  body.innerHTML=sec.blocks.map(blockHTML).join('');
  body.scrollTop=0;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.body.style.overflow='hidden';
  history.replaceState(null,'','#'+id);
  body.scrollTop=0;
  if(anchor){
    setTimeout(()=>{
      const target=document.getElementById(anchor);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    }, 60);
  }

  // wire dynamic bits
  const sendBtn=document.getElementById('fbSend');
  if(sendBtn){
    sendBtn.onclick=()=>{
      const name=document.getElementById('fbName').value||'';
      const msg=document.getElementById('fbMsg').value||'';
      const subject=encodeURIComponent('Cevedale 20 — feedback');
      const body=encodeURIComponent(`${name}\n\n${msg}`);
      window.location.href=`mailto:anje76@gmail.com?subject=${subject}&body=${body}`;
    };
  }
  const wTabs=document.getElementById('wLocTabs');
  if(wTabs){
    wTabs.querySelectorAll('.wloc-tab').forEach(btn=>{
      btn.onclick=()=>loadWeather(parseInt(btn.dataset.idx,10));
    });
  }
  if(document.getElementById('weatherBox')) loadWeather();
  if(document.getElementById('eventsTodayBox')) loadEventsToday();
}

function closeSection(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow='';
  history.replaceState(null,'',location.pathname+location.search);
}

function renderAll(){
  initLangBar();
  renderHome();
}

document.getElementById('overlay').onclick=closeSection;
document.getElementById('sheetClose').onclick=closeSection;
document.getElementById('ctaContact').onclick=()=>openSection('contacts');

renderAll();
if(location.hash){ const id=location.hash.slice(1); if(DATA[lang].sections[id]) setTimeout(()=>openSection(id),50); }

/* =========================================================
   WEATHER (Open-Meteo, no API key required)
   ========================================================= */
const WEATHER_LOCATIONS = [
  {key:'male', tabLabel:{it:'Malè', en:'Malè'}, name:{it:'Malè, Val di Sole', en:'Malè, Val di Sole'}, lat:46.357, lon:10.918},
  {key:'peio', tabLabel:{it:'Peio', en:'Peio'}, name:{it:'Peio, Val di Peio', en:'Peio, Val di Peio'}, lat:46.3606, lon:10.6837},
  {key:'tonale', tabLabel:{it:'Tonale', en:'Tonale'}, name:{it:'Passo del Tonale', en:'Passo del Tonale'}, lat:46.2578, lon:10.5975},
  {key:'rabbi', tabLabel:{it:'Rabbi', en:'Rabbi'}, name:{it:'Rabbi Fonti, Val di Rabbi', en:'Rabbi Fonti, Val di Rabbi'}, lat:46.4459, lon:10.8409},
  {key:'campiglio', tabLabel:{it:'Campiglio', en:'Campiglio'}, name:{it:'Madonna di Campiglio', en:'Madonna di Campiglio'}, lat:46.2273, lon:10.8260},
];
let weatherLocIndex = 0;

function wIconFor(code){
  if(code===0) return 'sun';
  if(code>=1 && code<=3) return 'cloud';
  if(code===45 || code===48) return 'cloud';
  if((code>=51 && code<=67) || (code>=80 && code<=82)) return 'cloud';
  if((code>=71 && code<=77) || code===85 || code===86) return 'snow';
  if(code>=95) return 'bolt';
  return 'cloud';
}

async function loadWeather(idx){
  if(typeof idx==='number') weatherLocIndex=idx;
  const loc=WEATHER_LOCATIONS[weatherLocIndex];
  const tEl=document.getElementById('wTemp');
  const daysEl=document.getElementById('wDays');
  const slotsEl=document.getElementById('wSlots');
  const nameEl=document.getElementById('wLocName');
  const iconEl=document.getElementById('wIcon');
  if(!tEl) return;
  if(nameEl) nameEl.textContent=loc.name[lang];
  document.querySelectorAll('#wLocTabs .wloc-tab').forEach((btn,i)=>btn.classList.toggle('active', i===weatherLocIndex));
  tEl.textContent='—';
  slotsEl.innerHTML='';
  daysEl.innerHTML='';
  try{
    const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FRome&forecast_days=4`);
    const j=await res.json();
    tEl.textContent = Math.round(j.current.temperature_2m)+'°C';
    if(iconEl) iconEl.innerHTML = icon(wIconFor(j.current.weather_code));

    // 6 forecast readings for today, every 4 hours
    const slotHours=[0,4,8,12,16,20];
    slotsEl.innerHTML = slotHours.map(h=>{
      const temp=j.hourly.temperature_2m[h];
      const code=j.hourly.weather_code[h];
      const label=(h<10?'0':'')+h+':00';
      return `<div class="wslot"><div class="t">${label}</div>${icon(wIconFor(code))}<b>${Math.round(temp)}°</b></div>`;
    }).join('');

    const labels = j.daily.time.map((t,i)=> i===0 ? (lang==='it'?'Oggi':'Today') : new Date(t).toLocaleDateString(lang==='it'?'it-IT':'en-GB',{weekday:'short'}));
    daysEl.innerHTML = j.daily.time.map((t,i)=>`<div class="day">${labels[i]}<b>${Math.round(j.daily.temperature_2m_max[i])}°</b></div>`).join('');
  }catch(e){
    tEl.textContent='—';
    daysEl.innerHTML=`<div class="day">${lang==='it'?'Meteo non disponibile':'Weather unavailable'}</div>`;
  }
}

/* =========================================================
   EVENTI OGGI — legge eventi.json (generato dal PDF APT)
   e mostra solo gli eventi di oggi (data specifica o ricorrenti)
   ========================================================= */
async function loadEventsToday(){
  const box = document.getElementById('eventsTodayBox');
  if(!box) return;
  const oggi = new Date();
  const iso = oggi.getFullYear()+'-'+String(oggi.getMonth()+1).padStart(2,'0')+'-'+String(oggi.getDate()).padStart(2,'0');
  const giorniIt = ['DOMENICA','LUNEDÌ','MARTEDÌ','MERCOLEDÌ','GIOVEDÌ','VENERDÌ','SABATO'];
  const giornoOggi = giorniIt[oggi.getDay()];
  try{
    const res = await fetch('./eventi.json', {cache:'no-store'});
    if(!res.ok) throw new Error('eventi.json non trovato');
    const data = await res.json();
    const eventi = (data.eventi||[]).filter(e=>{
      if(e.tipo==='data_specifica') return e.data===iso;
      if(e.tipo==='ricorrente') return e.ricorrenza==='TUTTI I GIORNI' || e.ricorrenza==='OGNI '+giornoOggi;
      return false;
    }).sort((a,b)=>(a.orario_inizio||'99:99').localeCompare(b.orario_inizio||'99:99'));

    if(eventi.length===0){
      box.innerHTML = `<div class="events-empty">${icon('calendar')}<p>${lang==='it'
        ? 'Nessun evento in programma per oggi (o l’elenco non è ancora stato aggiornato).'
        : 'No events scheduled for today (or the list hasn’t been updated yet).'}</p></div>`;
      return;
    }
    box.innerHTML = eventi.map(e=>`
      <div class="event-card">
        <div class="event-time">${e.orario_inizio ? e.orario_inizio + (e.orario_fine?(' – '+e.orario_fine):'') : (lang==='it'?'Tutto il giorno':'All day')}</div>
        <div class="event-body">
          <div class="event-title">${e.titolo||''}</div>
          <div class="event-place">${[e.comune, e.luogo].filter(Boolean).join(' · ')}</div>
          ${e.descrizione ? `<div class="event-desc">${e.descrizione}</div>` : ''}
        </div>
      </div>`).join('');
  }catch(err){
    box.innerHTML = `<div class="events-empty">${icon('calendar')}<p>${lang==='it'
      ? 'Elenco eventi non disponibile al momento. Riprova più tardi.'
      : 'Events list not available right now. Please try again later.'}</p></div>`;
  }
}
