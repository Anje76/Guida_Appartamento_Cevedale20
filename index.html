<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cevedale 20 — Guida Ospiti / Guest Guide</title>
<meta name="description" content="Guida digitale per gli ospiti di Cevedale 20, Malè, Val di Sole">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#ECE4DB;
    --panel:#F8F2E7;
    --forest:#33513A;
    --forest-dk:#233A29;
    --forest-lt:#4E6D53;
    --gold:#E3A53A;
    --gold-dk:#C7862A;
    --clay:#A8633D;
    --clay-dk:#8B4E2E;
    --ink:#2A2420;
    --ink-soft:#5B5346;
    --line:#E1D5B8;
    --line-soft:#EBE1CB;
    --danger:#B4482F;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow:0 10px 30px -12px rgba(43,36,25,.25);
    --shadow-sm:0 4px 14px -6px rgba(43,36,25,.2);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -10%, #FFFDF6 0%, var(--cream) 55%),
      var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Baloo 2',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- App shell ---------- */
  .app{max-width:560px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:40px;}

  .topbar{
    display:flex; align-items:center; justify-content:flex-end;
    padding:12px 18px;
  }
  .langbar{display:flex; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px;}
  .langbar button{
    border:none; background:transparent; padding:2px; border-radius:7px;
    cursor:pointer; line-height:0; opacity:.5; transition:opacity .15s ease, box-shadow .15s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .langbar button svg{width:26px; height:18px; display:block; border-radius:5px;}
  .langbar button.active{opacity:1; box-shadow:0 0 0 2px var(--forest);}

  /* ---------- Hero ---------- */
  .hero-banner{width:100%;}
  .hero-banner img{width:100%; height:auto; display:block;}
  .hero{padding:14px 20px 6px; text-align:center;}
  .ridge{
    width:100%; height:34px; margin:6px 0 2px;
  }
  .hero h1{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; margin:10px 0 4px; color:var(--forest-dk);
    letter-spacing:.01em;
  }
  .hero p{margin:0; color:var(--ink-soft); font-size:14.5px; line-height:1.5; padding:0 6px;}

  .tap-hint{
    text-align:center; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--forest-lt); font-weight:700; margin:22px 0 12px;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    padding:0 16px 10px;
  }
  @media (min-width:460px){ .grid{grid-template-columns:repeat(3,1fr);} }
  .tile{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius-md);
    padding:16px 8px 12px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; text-align:center;
    box-shadow:var(--shadow-sm);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .tile:active{transform:scale(.96);}
  .tile:hover{border-color:var(--gold); box-shadow:0 10px 22px -10px rgba(227,165,58,.45);}
  .tile-icon{
    width:44px; height:44px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#EFE3C6,#E7D6AE);
    color:var(--forest-dk);
  }
  .tile-icon svg{width:23px; height:23px;}
  .tile-label{font-size:11.5px; font-weight:700; color:var(--ink); line-height:1.25;}
  .tile{position:relative;}
  .tile-beta{
    position:absolute; top:7px; right:7px;
    background:var(--clay); color:#fff; font-size:8.5px; font-weight:800;
    letter-spacing:.04em; padding:2px 5px; border-radius:6px; line-height:1;
    box-shadow:0 2px 6px -2px rgba(139,78,46,.6);
  }

  /* ---------- Essential tiles (priority) ---------- */
  .tile-essential{
    background:linear-gradient(160deg,#F7ECCE,#EFDBA2);
    border:1px solid #D9B565;
    box-shadow:0 10px 24px -11px rgba(199,134,42,.4);
  }
  .tile-essential:hover{border-color:var(--gold-dk); box-shadow:0 12px 26px -11px rgba(199,134,42,.55);}
  .tile-essential .tile-icon{
    background:linear-gradient(160deg,var(--forest),var(--forest-dk));
    color:#F8F2E7;
  }
  .tile-essential .tile-label{color:var(--forest-dk);}

  /* ---------- Section labels ---------- */
  .section-label{
    display:inline-block;
    font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:var(--forest-dk);
    background:var(--line-soft);
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:999px;
    margin:0 0 10px;
  }
  .section-label-wrap{padding:14px 16px 0; text-align:center;}
  .section-label-wrap:first-of-type{padding-top:0;}
  .sheet-head .beta-badge{
    background:var(--clay); color:#fff; font-size:10px; font-weight:800;
    letter-spacing:.04em; padding:3px 7px; border-radius:999px; margin-left:8px; flex:none;
  }

  /* ---------- Footer / contact CTA ---------- */
  .cta-wrap{padding:8px 16px 0;}
  .cta{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--forest); color:#fff; border:none;
    padding:15px; border-radius:999px; width:100%;
    font-weight:700; font-size:14.5px; letter-spacing:.02em; cursor:pointer;
    box-shadow:0 12px 24px -10px rgba(51,81,58,.55);
  }
  .cta svg{width:17px;height:17px;}

  .hostline{text-align:center; font-size:12px; color:var(--ink-soft); margin-top:16px;}
  .hostline b{color:var(--forest-dk);}

  /* ---------- Detail sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(35,29,22,.42);
    opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:40;
  }
  .sheet-overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:560px;
    background:var(--cream);
    border-radius:26px 26px 0 0;
    max-height:92vh; overflow:hidden;
    display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 -20px 50px -10px rgba(20,16,10,.4);
    z-index:41;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-grabber{width:38px; height:4px; background:var(--line); border-radius:99px; margin:10px auto 0;}
  .sheet-head{
    display:flex; align-items:center; gap:12px; padding:12px 18px 12px;
    border-bottom:1px solid var(--line-soft);
  }
  .sheet-head .icon{
    width:38px; height:38px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#EFE3C6,#E7D6AE); color:var(--forest-dk);
  }
  .sheet-head .icon svg{width:20px;height:20px;}
  .sheet-head h2{font-family:'Baloo 2',sans-serif; font-size:18.5px; margin:0; color:var(--forest-dk);}
  .sheet-close{
    margin-left:auto; border:none; background:var(--panel); border:1px solid var(--line);
    width:32px; height:32px; border-radius:50%; cursor:pointer; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .sheet-body{padding:16px 18px 30px; overflow-y:auto;}

  /* content blocks */
  .b-p{font-size:14.5px; line-height:1.6; color:var(--ink); margin:0 0 12px;}
  .b-h{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; color:var(--forest-dk); margin:18px 0 8px; display:flex; align-items:center; gap:7px;}
  .b-h:first-child{margin-top:2px;}
  .b-h .mtick{width:14px;height:10px; flex:none;}
  .b-list{margin:0 0 14px; padding:0; list-style:none;}
  .b-list li{
    font-size:14.5px; line-height:1.55; color:var(--ink); margin-bottom:8px; padding-left:20px; position:relative;
  }
  .b-list li:before{
    content:""; position:absolute; left:0; top:8px; width:7px; height:7px; border-radius:2px;
    background:var(--gold); transform:rotate(45deg);
  }
  .b-p a, .b-list a, .b-note a{color:var(--gold-dk); font-weight:700; text-decoration:underline; text-underline-offset:2px;}
  .b-note{
    background:#FBF1DA; border:1px solid #EBD6A0; border-left:4px solid var(--gold-dk);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:13.8px; line-height:1.55; margin:0 0 14px; color:var(--ink);
  }
  .b-warn{
    background:#FCEBE4; border:1px solid #EFC1AE; border-left:4px solid var(--danger);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:13.8px; line-height:1.55; margin:0 0 14px; color:#6E2A16;
  }
  .b-ph{
    border:1.5px dashed #C9BB98; border-radius:var(--radius-sm); padding:12px 14px; margin:0 0 14px;
    font-size:13px; line-height:1.5; color:var(--ink-soft); background:rgba(255,255,255,.4);
  }
  .b-ph b{color:var(--clay-dk);}
  .b-link{
    display:flex; align-items:center; gap:10px; text-decoration:none;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 14px; margin:0 0 10px; font-size:14px; font-weight:600; color:var(--forest-dk);
  }
  .b-link svg{width:17px;height:17px; flex:none; color:var(--gold-dk);}
  .b-link .arrow{margin-left:auto; width:14px;height:14px; color:var(--ink-soft);}
  .b-img{margin:0 0 14px;}
  .b-img img{
    width:100%; display:block; border-radius:var(--radius-sm); border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
  }
  .b-img .cap{font-size:12px; color:var(--ink-soft); text-align:center; margin-top:6px; line-height:1.4;}
  .b-map{margin:0 0 14px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow-sm);}
  .b-map iframe{width:100%; height:220px; display:block; border:none;}
  .b-brand{
    display:block; text-decoration:none;
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-sm); overflow:hidden; margin:0 0 14px; box-shadow:var(--shadow-sm);
  }
  .b-brand .logostrip{background:#1267AA; padding:18px 20px; text-align:center;}
  .b-brand .logostrip img{max-width:220px; width:60%; height:auto; display:inline-block;}
  .b-brand .row{display:flex; align-items:center; gap:10px; padding:12px 14px;}
  .b-brand .tag{flex:1; font-size:12.5px; color:var(--ink-soft); line-height:1.4;}
  .b-brand .arrow{width:14px;height:14px; color:var(--ink-soft); flex:none;}

  .b-steps{margin:0 0 14px; padding:0; list-style:none;}
  .b-step{display:flex; gap:12px; padding-bottom:16px; position:relative;}
  .b-step:not(:last-child):before{
    content:""; position:absolute; left:15px; top:32px; bottom:0; width:2px;
    background:var(--line);
  }
  .b-step .num{
    width:32px; height:32px; border-radius:50%; flex:none; background:var(--forest); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13.5px;
    z-index:1;
  }
  .b-step.alt .num{background:var(--clay);}
  .b-step .body{flex:1; padding-top:3px;}
  .b-step .st-title{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14.5px; color:var(--forest-dk); margin-bottom:3px;}
  .b-step .st-text{font-size:13.8px; line-height:1.55; color:var(--ink);}

  .b-place{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; margin:0 0 14px; box-shadow:var(--shadow-sm);}
  .b-place .pl-photo{width:100%; height:150px; object-fit:cover; display:block;}
  .b-place .pl-logostrip{background:#fff; padding:16px 20px; text-align:center; border-bottom:1px solid var(--line);}
  .b-place .pl-logostrip img{max-height:56px; max-width:70%; width:auto; height:auto; display:inline-block;}
  .b-place .pl-logofull{width:100%; height:150px; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; border-bottom:1px solid var(--line);}
  .b-place .pl-logofull img{max-width:88%; max-height:82%; width:auto; height:auto; object-fit:contain; display:block;}
  .b-place .pl-body{padding:14px;}
  .b-place .pl-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .b-place .pl-tag{
    display:inline-block; background:var(--clay); color:#fff; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .b-place .pl-dist{
    display:inline-block; background:var(--forest); color:#fff; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:999px; white-space:nowrap; flex:none;
  }
  .b-place .pl-name{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; color:var(--forest-dk); margin-bottom:2px;}
  .b-place .pl-addr{font-size:12px; color:var(--ink-soft); margin-bottom:8px;}
  .b-place .pl-desc{font-size:13.8px; line-height:1.55; color:var(--ink); margin-bottom:10px;}
  .b-place .pl-hours{width:100%; border-collapse:collapse; margin:0 0 10px; font-size:12.5px;}
  .b-place .pl-hours td{padding:4px 0; border-bottom:1px solid var(--line-soft);}
  .b-place .pl-hours tr:last-child td{border-bottom:none;}
  .b-place .pl-hours td:first-child{font-weight:600; color:var(--forest-dk);}
  .b-place .pl-hours td:last-child{text-align:right; color:var(--ink-soft);}
  .b-place .pl-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .b-place .pl-actions a{
    display:flex; align-items:center; gap:6px; background:var(--cream); border:1px solid var(--line);
    border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:700; color:var(--forest-dk); text-decoration:none;
  }
  .b-place .pl-actions a svg{width:13px;height:13px; color:var(--gold-dk); flex:none;}
  .b-place-link{display:block; text-decoration:none; color:inherit; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;}
  .b-place-link:active{transform:scale(.98);}
  .b-place-link .pl-cta{display:flex; align-items:center; gap:6px; font-weight:700; color:var(--forest-dk); font-size:13.5px; margin-top:6px;}
  .b-place-link .pl-cta svg{width:15px; height:15px; color:var(--gold-dk); flex:none;}
  .b-code{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--forest-dk); color:#fff; border-radius:var(--radius-sm); padding:13px 14px; margin:0 0 14px;
  }
  .b-code .lbl{font-size:11.5px; opacity:.75; text-transform:uppercase; letter-spacing:.08em; margin-bottom:3px;}
  .b-code .val{font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:700; letter-spacing:.04em;}
  .b-code button{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff;
    border-radius:8px; padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer; flex:none;
  }
  .b-contact{
    display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:12px 14px; margin:0 0 10px;
  }
  .b-contact .av{
    width:38px;height:38px;border-radius:50%; background:linear-gradient(160deg,var(--forest-lt),var(--forest-dk));
    color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Baloo 2'; flex:none;
  }
  .b-contact .info{flex:1; min-width:0;}
  .b-contact .name{font-weight:700; font-size:14px; color:var(--ink);}
  .b-contact .sub{font-size:12.5px; color:var(--ink-soft);}
  .b-contact .acts{display:flex; gap:6px; flex:none;}
  .b-contact .acts a{
    width:32px;height:32px; border-radius:50%; background:var(--forest); color:#fff;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
  }
  .b-contact .acts a svg{width:15px;height:15px;}
  .b-hours{width:100%; border-collapse:collapse; margin:0 0 14px; font-size:13.5px;}
  .b-hours td{padding:6px 4px; border-bottom:1px solid var(--line-soft);}
  .b-hours td:first-child{font-weight:600; color:var(--forest-dk);}
  .b-hours td:last-child{text-align:right; color:var(--ink-soft);}
  .b-weather{
    background:linear-gradient(160deg,var(--forest),var(--forest-dk)); color:#fff; border-radius:var(--radius-md);
    padding:18px; margin:0 0 14px;
  }
  .b-weather .wloc-tabs{display:flex; gap:6px; overflow-x:auto; margin:0 0 16px; padding-bottom:2px; -ms-overflow-style:none; scrollbar-width:none;}
  .b-weather .wloc-tabs::-webkit-scrollbar{display:none;}
  .b-weather .wloc-tab{
    flex:none; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.1); color:#fff;
    font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .b-weather .wloc-tab.active{background:#fff; color:var(--forest-dk); border-color:#fff;}
  .b-weather .row{display:flex; align-items:center; justify-content:space-between;}
  .b-weather .temp{font-family:'Baloo 2'; font-size:38px; font-weight:700;}
  .b-weather .loc{font-size:13px; opacity:.85;}
  .b-weather #wIcon svg{width:100%; height:100%;}
  .b-weather .wslots{
    display:flex; justify-content:space-between; gap:4px; margin-top:16px; padding-top:14px;
    border-top:1px solid rgba(255,255,255,.22);
  }
  .b-weather .wslot{text-align:center; font-size:10.5px; opacity:.92; flex:1;}
  .b-weather .wslot .t{opacity:.7; margin-bottom:5px;}
  .b-weather .wslot svg{width:16px; height:16px; margin:0 auto; display:block;}
  .b-weather .wslot b{display:block; font-size:12.5px; margin-top:4px;}
  .b-weather .days{display:flex; justify-content:space-between; margin-top:14px; padding-top:14px; gap:6px; border-top:1px solid rgba(255,255,255,.22);}
  .b-weather .day{text-align:center; font-size:11.5px; opacity:.9; flex:1;}
  .b-weather .day b{display:block; font-size:14px; margin-top:2px;}

  .b-events{margin:0 0 14px;}
  .events-loading, .events-empty{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
    color:var(--ink-soft); padding:28px 10px; background:var(--panel); border:1px solid var(--line-soft);
    border-radius:var(--radius-md); font-size:13.5px;
  }
  .events-loading svg, .events-empty svg{width:26px; height:26px; opacity:.6;}
  .event-card{
    display:flex; gap:12px; align-items:flex-start; background:var(--panel);
    border:1px solid var(--line-soft); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:10px;
  }
  .event-time{
    flex:none; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:#fff;
    background:var(--forest); border-radius:8px; padding:6px 8px; text-align:center; line-height:1.3; min-width:58px;
  }
  .event-title{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; color:var(--forest-dk); line-height:1.3;}
  .event-place{font-size:12px; font-weight:600; color:var(--gold-dk); margin-top:2px;}
  .event-desc{font-size:13px; line-height:1.5; color:var(--ink-soft); margin-top:5px;}

  .b-form textarea, .b-form input{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 12px;
    font-family:inherit; font-size:14px; margin-bottom:10px; background:var(--panel); color:var(--ink);
  }
  .b-form label{font-size:12.5px; font-weight:700; color:var(--forest-dk); display:block; margin-bottom:5px;}
  .b-form button{
    width:100%; background:var(--clay); color:#fff; border:none; border-radius:999px; padding:13px;
    font-weight:700; font-size:14px; cursor:pointer;
  }

  .divider{
    height:1px; background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px); margin:18px 0;
  }

  ::-webkit-scrollbar{width:0;}
  :focus-visible{outline:2.5px solid var(--gold-dk); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="topbar">

        title:'Cucina',
        blocks:[
          {t:'h', text:'Piano cottura a induzione'},
          {t:'p', text:'Il piano cottura è ad induzione. Nel mobile accanto al frigo sono presenti pentole, casseruole e padelle antiaderenti compatibili. Anche la caffettiera moka Barazzoni è compatibile con il piano induzione (ma non va usata con potenza superiore a 5, o darà errore).'},
          {t:'warn', text:'IMPORTANTE: al fine di evitare sovraccarichi e distacchi dell’impianto elettrico, vi preghiamo di non utilizzare il piano cottura contemporaneamente ad altri elettrodomestici di elevato consumo energetico (forno, lavatrice, asciugacapelli, aspirapolvere).'},
          {t:'p', text:'Per la cottura dei cibi consigliamo di utilizzare al massimo due piastre, con una potenza complessiva indicata sui display non superiore a 10‑12 (ad esempio: piastra con pentola dell’acqua a 6‑7, tegame col sugo a 5‑4).'},
          {t:'img', src:'images/cucina-induzione-it.jpg', alt:'Comandi del piano cottura a induzione', caption:'I principali comandi per gestire il piano cottura'},
          {t:'p', text:'Qui sopra trovate i principali comandi per gestire il piano cottura. Le istruzioni complete si trovano nel cassetto centrale del mobile con TV in soggiorno.'},
          {t:'note', text:'Se sul display viene visualizzata la voce “Lo”, significa che avete inavvertitamente inserito il blocco di sicurezza. Per sbloccarlo, basta tenere premuto per qualche secondo il simbolo CHIAVE.'},
          {t:'img', src:'images/cucina-simbolo-chiave.jpg', alt:'Simbolo a forma di chiave sul piano cottura', caption:'Il simbolo CHIAVE da tenere premuto per sbloccare il piano cottura'},

        title:'Emergenze in casa',
        blocks:[

          {t:'p', text:'È possibile riattivarla con gli interruttori vicini alla porta d’ingresso, oppure dall’interruttore del contatore generale, che si trova in una stanza al piano seminterrato: uscendo dall’ascensore al piano -1, è la porta subito a destra.'},
          {t:'img', src:'images/emergenza-stanza-contatori.jpg', alt:'Corridoio al piano -1 con porta della stanza contatori', caption:'Usciti dall’ascensore al piano -1, la porta della stanza contatori è subito a destra'},
          {t:'p', text:'Il contatore è in alto a destra, identificato dal numero “20” e dalla targhetta “FLAMINI-GIANGRANDI”.'},
          {t:'img', src:'images/emergenza-contatore.jpg', alt:'Contatore elettrico n. 20 nella stanza contatori', caption:'Il contatore n. 20, in alto a destra nella fila'},
          {t:'h', text:'Estintore'},
          {t:'p', text:'Si trova nel cassetto di legno basso tra il camino e la poltrona singola. Basta sollevare il coperchio.'},
          {t:'warn', text:'L’estintore è un dispositivo di sicurezza da utilizzare unicamente in caso di reale emergenza: l’attivazione impropria provoca danni irreversibili ad arredi e pavimenti, il cui ripristino sarà interamente addebitato all’ospite.'},
          {t:'h', text:'Numeri utili'},
          {t:'p', text:'Per qualsiasi emergenza sanitaria, incendio o pubblica sicurezza chiamate il <b>112</b> (numero unico di emergenza). Trovate altri contatti utili nella sezione “Contatti & aiuto”.'},

          {t:'img', src:'images/parcheggio-piazzola-20.jpg', alt:'Piazzola di parcheggio riservata numero 20', caption:'La piazzola riservata, contrassegnata dal numero “20” sul muro dell’edificio'},

          {t:'h', text:'Zone a Traffico Limitato'},
          {t:'p', text:'A Malè (e in tutta la Val di Sole) non sono attive zone ZTL permanenti o con varchi elettronici. In ogni località esistono aree pedonali, ma sono solitamente transennate ed è pressoché impossibile accedervi per errore.'},
          {t:'h', text:'Chiusura al traffico della Val di Rabbi'},
          {t:'p', text:'Dal <b>27 giugno al 6 settembre</b>, dalle 9:45 alle 17:00, la provinciale viene chiusa all’altezza di Plazze dei Forni, dove è presente un ampio parcheggio a pagamento. Potete accedere alla parte alta della Val di Rabbi solamente a piedi, in bici o con le navette del Parco (Stelviobus).'},
          {t:'warn', text:'Attenzione: alcune linee (2‑3‑4) hanno posti limitati ed è necessaria la prenotazione telefonando entro il giorno precedente al <a href="tel:+393466726120">346 672 6120</a>, in orario 9:00–17:00.'},
          {t:'p', text:'Passando prima delle 9:45 è possibile raggiungere il parcheggio AL PLAN (ideale per la visita al Ponte Tibetano) oppure il parcheggio COLER (per visitare le Cascate del Saent).'},

      faq:{
        title:'Info / FAQ',
        blocks:[
          {t:'h', text:'A che ora posso accedere/lasciare l’appartamento?'},
          {t:'p', text:'Salvo diverso accordo con i proprietari, il check-in è richiesto tra le 12 e le 18, poiché il portone in Galleria rimane aperto in quella fascia oraria. Qualora prevediate di giungere più tardi delle 18, manteneteci informati: provvederemo a farvi aprire da una persona presente in loco. Il check-out è richiesto entro le 10:00, ma se avete necessità di posticipare tale orario, comunicatecelo: cercheremo di venirvi incontro.'},

          {t:'h', text:'Posso portare animali domestici?'},
          {t:'p', text:'Sì, nel numero massimo di uno. Resta a carico dell’ospite l’onere di predisporre lettiere.'},

          {t:'p', text:'Sì, oltre alle scale è disponibile un ascensore fino al 1° piano dell’appartamento.'},

          {t:'p', text:'Nell’Ufficio Informazioni Turistiche di Malè, in centro, al piano terra dell’ufficio del Comune, troverete tutte le informazioni e gli opuscoli per vivere al meglio la vostra vacanza.'},

          {t:'p', text:'Dear guests, welcome to Val di Sole! We’re Angelo and Silvia, and we’re delighted to host you at <b>Cevedale 20</b>, your retreat in Malè.'},
          {t:'p', text:'This little digital guide has everything you need for your stay: how to reach the apartment, how to get in, the house rules, waste disposal, and plenty of tips to make the most of the valley.'},
          {t:'note', text:'Tap an icon on the home screen to open the section you need. You can go back home anytime using the back arrow or by closing the panel.'},
          {t:'p', text:'We wish you a stay full of fresh air, mountains and relaxation!'},
        ]
      },
      eventsToday:{
        title:'Events Today',
        blocks:[
          {t:'warn', text:'⚠️ <b>This section is in BETA testing</b>: it may contain errors in times or locations. Please double-check the information against the official brochure published by the Val di Sole tourist office (APT), available at the Tourist Information Office or downloadable online.'},
          {t:'link', icon:'pin', label:'APT Tourist Office — Via Marconi 7, Malè', url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Via Marconi 7, Malè')},
          {t:'link', icon:'phone', label:'Call the Tourist Office — +39 0463 901280', url:'tel:+390463901280'},
          {t:'link', icon:'globe', label:'Download the APT Val di Sole events programme', url:'https://www.visitvaldisole.it/it/eventi'},
          {t:'p', text:'Events happening in Val di Sole <b>today</b>, automatically updated from the local tourist office’s brochure.'},
          {t:'events_today'},
          {t:'note', text:'Source: Val di Sole tourist office (APT) brochure. Listings are in Italian and may change due to weather — please check times with the local Info Offices before attending.'},
        ]
      },
      location:{
        title:'Location',
        blocks:[
          {t:'p', text:'The apartment is located in Malè, at <b>Via IV Novembre 16</b>, inside the “Galleria Cevedale”.'},
          {t:'mapembed', query:'Via IV Novembre 16, 38027 Malè TN'},
          {t:'link', icon:'pin', label:'Open the address on Google Maps', url:MAPS.address},
          {t:'h', text:'Getting here by car'},
          {t:'steps', items:[
            {num:'1', title:'Motorway exit', text:'Take the “Trento Nord – Interporto” or “S. Michele all’Adige / Mezzocorona” exit on the <b>A22 Brenner motorway</b>.'},
            {num:'2', title:'Follow the signs', text:'Follow the signs for Mezzolombardo, Cles, Malè (SS.42), heading toward <b>Val di Non / Val di Sole</b>.'},
            {num:'3', title:'The Cevedale building', text:'Reach the “Cevedale” building, at Via IV Novembre 16 in Malè (TN) — see the map above.'},
            {num:'4', title:'Reserved parking', text:'Park in the reserved spot: bay no. 20, on the right side of the building, at the far end (reached by going around the building clockwise) — details and photos below.'},
          ]},
          {t:'note', text:'<b>If you’re coming from Milan</b>, you could also consider the Bergamo → SS.42 → Passo del Tonale route — same travel time, but no motorway tolls.'},
          {t:'img', src:'images/edificio-parcheggio.jpg', alt:'Building with the Galleria entrance and parking spot 20', caption:'The building seen from the street: the Galleria entrance on the left, parking spot n. 20 on the right'},
          {t:'h', text:'Reserved parking'},
          {t:'p', text:'You have a reserved parking spot, marked with yellow lines, next to the back-right corner of the building, by a sign showing the number “20”. Reach it by going around the building clockwise.'},
          {t:'img', src:'images/mappa-parcheggio.jpg', alt:'Satellite map with the route to the reserved parking spot', caption:'Route (in red) to the reserved parking spot n. 20; in green the free spots with no number'},
          {t:'img', src:'images/parcheggio-piazzola-20.jpg', alt:'Reserved parking bay number 20', caption:'The reserved parking bay, marked with the number “20” on the building wall'},
          {t:'p', text:'In front of the gallery’s entrance there are further free parking spots, marked with yellow lines but without an identifying number.'},
          {t:'h', text:'Galleria Cevedale entrance'},
          {t:'p', text:'The apartment entrance is inside the Galleria Cevedale, next to the Bar Cevedale.'},
          {t:'img', src:'images/ingresso-galleria.jpg', alt:'Steps up to the Galleria Cevedale entrance', caption:'The entrance to the Galleria Cevedale, next to the Bar Cevedale'},
          {t:'jump', to:'checkin', icon:'key', label:'To get into the apartment'},
        ]
      },
      checkin:{
        title:'Check-in & Check-out',
        blocks:[
          {t:'h', text:'Galleria Cevedale entrance'},
          {t:'p', text:'The apartment entrance is inside the Galleria Cevedale, next to the Bar Cevedale. For the address, map and driving directions, see the “Location” section.'},
          {t:'img', src:'images/ingresso-galleria.jpg', alt:'Steps up to the Galleria Cevedale entrance', caption:'The entrance to the Galleria Cevedale, next to the Bar Cevedale'},
          {t:'h', text:'Getting in'},
          {t:'p', text:'The Galleria’s main door is usually open from <b>8am to 6pm</b>: just push it forward to reach the stairs. Outside these hours you’ll need the keys to open it.'},
          {t:'p', text:'Go up to the <b>1st floor</b> (a lift is also available), turn right down the corridor, and you’ll find the entrance at the second door on the right — apartment 20, doorbell “FLAMINI-GIANGRANDI”.'},
          {t:'img', src:'images/portone-condominio.jpg', alt:'Building entrance door', caption:'The building’s entrance door, on the 1st floor'},
          {t:'h', text:'The lock box'},
          {t:'p', text:'Next to the door you’ll find a small lock box. Open the black cover downward, enter the combination (which you’ll receive on check-in day), and turn the top knob clockwise.'},
          {t:'img', src:'images/cassetta-sicurezza.jpg', alt:'Instructions for opening the lock box', caption:'To open: enter the 4-digit code and turn the knob clockwise. To close: turn it counter-clockwise and reset the combination to 0‑0‑0‑0'},
          {t:'p', text:'You’ll find 3 keys: the longest opens the apartment door; the two shorter ones open the gallery’s main door and the ground-floor exit door on the right side of the building, toward the private parking spot (handy for luggage).'},
          {t:'code', label:'Lock box code', value:'provided at check-in'},
          {t:'warn', text:'When done, close the lock box, turn the knob counter-clockwise and reset the combination to 0‑0‑0‑0. Please never leave the combination you were given in view.'},
          {t:'h', text:'On the day of your departure, please'},
          {t:'list', items:[
            'Don’t leave any rubbish in the apartment',
            'Put the waste card and TV remote back in the wooden holder',
            'Close the windows',
            'Vacate the apartment by 10:00am',
            'Put the apartment keys back in the lock box',
            'Let us know about any issue you ran into',
          ]},
          {t:'note', text:'If you enjoyed your stay, a review on Airbnb would truly mean a lot to us (of course, entirely optional) 💛'},
        ]
      },
      rules:{
        title:'House rules',
        blocks:[
          {t:'p', text:'To keep the stay pleasant for you and for future guests, we ask you to follow a few simple rules.'},
          {t:'h', text:'Using the kitchen'},
          {t:'p', text:'To avoid overloading and tripping the electrical system, please <b>don’t use the cooktop at the same time</b> as other high-power appliances (oven, washing machine, hairdryer, vacuum cleaner). Full details in the “Appliances” section.'},
          {t:'h', text:'Waste'},
          {t:'p', text:'Sorted waste collection is mandatory in Malè. Full instructions are in the “Waste disposal” section.'},
          {t:'h', text:'No smoking'},
          {t:'p', text:'Smoking and lighting any kind of open flame (e.g. candles) is not allowed inside the apartment.'},
          {t:'h', text:'Maximum number of guests'},
          {t:'p', text:'The apartment can accommodate a maximum of 4 guests.'},
          {t:'h', text:'Tourist tax'},
          {t:'p', text:'The provincial tourist tax is €1 per person, per night. It is charged to guests staying at the property, up to a maximum of 10 consecutive nights. Children under 14 and some other categories are exempt. If you believe you qualify, please let us know so we can apply the exemption.'},
          {t:'jump', to:'taxExemptions', icon:'info', label:'Who doesn’t have to pay — see the exemptions'},
        ]
      },
      wifi:{
        title:'Wi‑Fi',
        blocks:[
          {t:'warn', text:'Unfortunately we are not able to provide a Wi‑Fi connection inside the apartment.'},
          {t:'h', text:'Free Wi‑Fi in central Malè'},
          {t:'p', text:'A short walk from the apartment you can use <b>TrentinoWiFi</b>, the free connectivity service run by the Autonomous Province of Trento, available in many squares and spots around central Malè.'},
          {t:'brand', name:'TrentinoWiFi', logo:'images/trentinowifi-logo.png', tagline:'Free quality Wi‑Fi service across our region', url:'https://www.trentinowifi.it/'},
          {t:'h', text:'How it works'},
          {t:'list', items:[
            'Look for the “TrentinoWiFi” network among the available Wi‑Fi networks on your phone or laptop',
            'The first time, complete a short free registration',
            'Once registered, you’ll connect automatically anywhere in Trentino where the TrentinoWiFi signal is available',
            'Browsing is free, with no time limits and no ads',
          ]},
          {t:'note', text:'For support with the TrentinoWiFi service: toll-free number 800 22 80 40, Monday to Friday, 8:00am–5:00pm.'},
          {t:'link', icon:'wifi', label:'Go to the TrentinoWiFi website', url:'https://www.trentinowifi.it/'},
        ]
      },
      appliances:{
        title:'Kitchen',
        blocks:[
          {t:'h', text:'Induction cooktop'},
          {t:'p', text:'The cooktop is induction. In the cabinet next to the fridge you’ll find pots, saucepans and non-stick pans compatible with it. The Barazzoni moka pot is also compatible with the induction cooktop (but shouldn’t be used above power level 5, or it will show an error).'},
          {t:'warn', text:'IMPORTANT: to avoid overloading and tripping the electrical system, please don’t use the cooktop at the same time as other high-power appliances (oven, washing machine, hairdryer, vacuum cleaner).'},
          {t:'p', text:'We recommend using no more than two hotplates at once, with a combined power shown on the display no higher than 10‑12 (e.g. a plate with a pot of water at 6‑7, a pan with sauce at 5‑4).'},
          {t:'img', src:'images/cucina-induzione-en.jpg', alt:'Induction cooktop controls', caption:'The main controls for the induction cooktop'},
          {t:'p', text:'Above you’ll find the main controls for the cooktop. Full instructions are in the central drawer of the TV cabinet in the living room.'},
          {t:'note', text:'If the display shows “Lo”, you’ve accidentally engaged the safety lock. To unlock it, just hold down the KEY symbol for a few seconds.'},
          {t:'img', src:'images/cucina-simbolo-chiave.jpg', alt:'Key-shaped symbol on the cooktop', caption:'The KEY symbol to hold down to unlock the cooktop'},
          {t:'jump', to:'emergency', icon:'bolt', label:'If the power meter trips, see “Home emergencies”'},
        ]
      },
      emergency:{
        title:'Home emergencies',
        blocks:[
          {t:'h', text:'If the power trips'},
          {t:'p', text:'You can restore it using the switches near the entrance door, or from the main meter switch, located in a room on the basement floor: exiting the lift on floor -1, it’s the first door on the right.'},
          {t:'img', src:'images/emergenza-stanza-contatori.jpg', alt:'Basement corridor with the meter-room door on floor -1', caption:'Exiting the lift on floor -1, the meter-room door is right on your right'},
          {t:'p', text:'The meter is on the upper right, labelled “20” and “FLAMINI-GIANGRANDI”.'},
          {t:'img', src:'images/emergenza-contatore.jpg', alt:'Electricity meter no. 20 in the meter room', caption:'Meter no. 20, upper right in the row'},
          {t:'h', text:'Fire extinguisher'},
          {t:'p', text:'It’s in the low wooden drawer between the fireplace and the single armchair. Just lift the lid.'},
          {t:'warn', text:'The fire extinguisher is a safety device to be used only in a genuine emergency: improper use causes irreversible damage to furniture and floors, and the cost of restoring it will be charged in full to the guest.'},
          {t:'h', text:'Useful numbers'},
          {t:'p', text:'For any medical, fire or public-safety emergency, call <b>112</b> (the single European emergency number). More contacts are in the “Contacts & help” section.'},
          {t:'jump', to:'medical', icon:'medical', label:'Need a doctor? See “Medical Service”'},
        ]
      },
      medical:{
        title:'Medical Service / Pharmacy',
        blocks:[
          {t:'h', text:'Medical service for tourists — Val di Sole'},
          {t:'note', text:'Active from <b>1 July</b> to <b>31 August 2026</b>, Monday to Friday, 8:00am–8:00pm. Outside this period or these hours, refer to the on-call service (116117) further below.'},
          {t:'p', text:'Cost: <b>€30</b> for a clinic visit, <b>€40</b> for a home visit. Work-related injuries are exempt for first aid.'},
          {t:'warn', text:'An appointment is required: call the doctor between 8:00–9:00am or 2:00–3:00pm (except for urgent cases). If you have respiratory symptoms, wear a surgical mask when entering the clinic.'},
          {t:'h', text:'Clinics (weekdays)'},
          {t:'place',
            name:'Malè — Poliambulatorio',
            address:'Via IV Novembre, 8 — Malè (TN)',
            desc:'Monday and Wednesday: 9:00–11:00am<br>Tuesday and Thursday: 3:00–5:00pm',
            mapsQuery:'Poliambulatorio Malè APSS, Via IV Novembre 8, Malè', mapsLabel:'Map', phone:'+393358240557', phoneDisplay:'335 824 0557'
          },
          {t:'place',
            name:'Mezzana — Municipal Clinic',
            address:'Via IV Novembre, 75 — Mezzana (TN)',
            desc:'Monday and Friday: 3:00–5:00pm<br>Tuesday and Thursday: 9:00–11:00am',
            mapsQuery:'Ambulatorio Comunale, Via IV Novembre 75, Mezzana TN', mapsLabel:'Map', phone:'+393358240557', phoneDisplay:'335 824 0557'
          },
          {t:'place',
            name:'Cogolo — Municipal Clinic',
            address:'Cogolo di Peio (TN)',
            desc:'Wednesday: 3:00–5:00pm<br>Friday: 9:00–11:00am',
            mapsQuery:'Ambulatorio Comunale Cogolo di Peio TN', mapsLabel:'Map', phone:'+393358240557', phoneDisplay:'335 824 0557'
          },
          {t:'note', text:'The same number (335 824 0557) is used to book both clinic and home visits, at all three locations.'},
          {t:'h', text:'Nights, weekends and 15 August'},
          {t:'p', text:'At night, on Saturdays, Sundays and on 15 August, contact the on-call medical service <b>only in urgent cases</b>.'},
          {t:'contact', name:'On-call medical service', sub:'Centrale Operativa Unificata', phone:'116117', email:''},
          {t:'h', text:'Pharmacy'},
          {t:'place',
            name:'Farmacia Tomasi',
            address:'Piazza Dante, 1 — 38027 Malè (TN)',
            desc:'Right in the centre of Malè.',
            mapsQuery:'Farmacia Tomasi, Piazza Dante 1, Malè', mapsLabel:'Map', phone:'+390463901131', phoneDisplay:'0463 901131',
            hours:[
            ['Mon–Sat','8:30am–12:30pm · 3:30–7:30pm'],
            ['Sunday','Closed (except duty shifts)'],
          ], email:'farmacia.dr.tomasi@gmail.com', url:'https://farmaciatomasi.com/', urlLabel:'farmaciatomasi.com'
          },
        ]
      },
      waste:{
        title:'Waste disposal',
        blocks:[
          {t:'p', text:'Malè operates a <b>mandatory</b> sorted waste collection system, with drop-off directly at the collection centre. We ask you to be responsible with waste management.'},
          {t:'h', text:'Organic waste'},
          {t:'p', text:'You can freely empty your organic-waste bag into the brown bins at the entrance of the Poliambulatorio, about 20 metres from the apartment.'},
          {t:'img', src:'images/rifiuti-bidoni.jpg', alt:'Organic waste bins and unsorted-waste collection point', caption:'The brown organic-waste bins and, next to them, the unsorted-waste collection point, at the entrance of the Poliambulatorio'},
          {t:'warn', text:'Note: lift the small round lid, not the large square one.'},
          {t:'h', text:'Unsorted (residual) waste'},
          {t:'p', text:'At the same spot there’s a masonry collection bell for unsorted waste, opened with the card you’ll find in the wooden holder on the TV cabinet in the living room.'},
          {t:'img', src:'images/rifiuti-espositore.jpg', alt:'Wooden holder with waste card and TV remote', caption:'The holder in the living room: you’ll find the waste card and the TV remote here (please put them back here at check‑out). The “PERCHÉ” card, using a contactless sensor, opens the unsorted-waste collector and the Ecoisola bins. It must always be shown to the staff at the Materials Recovery Centre.'},
          {t:'note', text:'Unsorted-waste drop-offs are rationed by the municipality: please do no more than 2‑3 per week (we suggest inserting 2 bags together each time).'},
          {t:'img', src:'images/rifiuti-mappa.jpg', alt:'Map showing the organic bins and unsorted-waste collector', caption:'The organic bins and unsorted-waste collector are along Via IV Novembre, a short walk from the apartment'},
          {t:'h', text:'Plastic, paper and glass'},
          {t:'p', text:'These need to be properly sorted and taken to the Malè Materials Recovery Centre, using the same card.'},
          {t:'link', icon:'pin', label:'Materials Recovery Centre — Google Maps', url:MAPS.crm},
          {t:'p', text:'Materials Recovery Centre phone: <a href="tel:+390463901253">+39 0463 901253</a>'},
          {t:'hours', rows:[
            ['Monday','closed (see Eco Isola)'],
            ['Tuesday','8:30–12:00 · 14:00–17:30'],
            ['Wednesday','8:30–12:00 · 14:00–17:30'],
            ['Thursday','8:30–12:00 · 14:00–17:30'],
            ['Friday','closed (see Eco Isola)'],
            ['Saturday','8:30–12:00 · 14:00–17:30'],
            ['Sunday','closed (see Eco Isola)'],
          ]},
          {t:'h', text:'Eco Isola'},
          {t:'img', src:'images/rifiuti-ecoisola.jpg', alt:'Eco Isola bins for paper, mixed packaging and glass', caption:'The Eco Isola bins, installed just outside the Materials Recovery Centre'},
          {t:'p', text:'Installed just outside the Materials Recovery Centre, it accepts paper and cardboard, light packaging and glass even when the Centre is closed. It’s only active <b>on the Centre’s closed days</b>, shutting off automatically at 10pm. The bins open with the waste card, by tapping it on a contactless sensor.'},
          {t:'note', text:'You don’t need to visit the recovery centre every day — you can go on your last (or second-to-last) day, subject to the Materials Recovery Centre or Ecoisola opening hours; it won’t take more than 10 minutes.'},
        ]
      },
      parking:{
        title:'Parking & LTZ',
        blocks:[
          {t:'p', text:'Your reserved parking spot, marked with yellow lines, is next to the back-right corner of the building, by the sign showing “20”. Reach it by going around the building clockwise.'},
          {t:'img', src:'images/parcheggio-piazzola-20.jpg', alt:'Reserved parking bay number 20', caption:'The reserved parking bay, marked with the number “20” on the building wall'},
          {t:'p', text:'In front of the gallery there are more free spots, marked with yellow lines and no identifying number.'},
          {t:'link', icon:'pin', label:'Open the location on Google Maps', url:MAPS.address},
          {t:'h', text:'Limited Traffic Zones'},
          {t:'p', text:'In Malè (and across Val di Sole) there are no permanent Limited Traffic Zones (LTZ/ZTL) and no electronic access gates. Every village has pedestrian areas, but they are usually fenced off, so entering by mistake is practically impossible.'},
          {t:'h', text:'Road closure in Val di Rabbi'},
          {t:'p', text:'From <b>27 June to 6 September</b>, from 9:45am to 5:00pm, the provincial road is closed at Plazze dei Forni, where there is a large paid car park. You can only reach the upper part of Val di Rabbi on foot, by bike, or with the Park’s shuttle buses (Stelviobus).'},
          {t:'warn', text:'Note: some lines (2‑3‑4) have limited seats and require booking by phone by the day before, calling <a href="tel:+393466726120">346 672 6120</a>, between 9:00am and 5:00pm.'},
          {t:'p', text:'If you pass through before 9:45am, you can reach the AL PLAN car park (ideal for visiting the Tibetan Bridge) or the COLER car park (for the Saent waterfalls).'},
          {t:'link', icon:'bus', label:'Stelviobus routes and timetables (PDF)', url:'https://www.visitvaldisole.it/website_files/trasporti/Stelviobus.pdf'},
        ]
      },
      faq:{
        title:'Info / FAQ',
        blocks:[
          {t:'h', text:'What time can I check in/out of the apartment?'},
          {t:'p', text:'Unless otherwise agreed with the hosts, check-in is expected between 12:00pm and 6:00pm, as the door to the Galleria stays open during that window. If you expect to arrive later than 6:00pm, please keep us informed: we’ll arrange for someone on site to let you in. Check-out is required by 10:00am, but if you need to push that back, just let us know — we’ll do our best to accommodate you.'},
          {t:'jump', to:'checkin', icon:'key', label:'“Check-in & Check-out” section'},
          {t:'h', text:'Can I bring pets?'},
          {t:'p', text:'Yes, up to a maximum of one pet. Guests are responsible for providing their own litter box/tray.'},
          {t:'h', text:'Is there a lift?'},
          {t:'p', text:'Yes — besides the stairs, a lift is available up to the apartment’s 1st floor.'},
          {t:'h', text:'Where do I dispose of waste?'},
          {t:'p', text:'You’ll find all the details, maps and opening hours in the “Waste disposal” section.'},
          {t:'jump', to:'waste', icon:'trash', label:'“Waste disposal” section'},
          {t:'h', text:'Is there a washing machine?'},
          {t:'p', text:'Yes, it’s available for your use. You’ll also find an outdoor drying rack and detergent in the bathroom.'},
          {t:'h', text:'Where can I find tourist information?'},
          {t:'p', text:'At the Malè Tourist Information Office, in the town centre, on the ground floor of the municipal building, you’ll find all the information and brochures you need to make the most of your holiday.'},
          {t:'place',
            name:'Malè Tourist Information Office',
            address:'Piazza Regina Elena, 75 — 38027 Malè (TN)',
            desc:'Open every day (closed 25 Dec), 8:30am–12:30pm · 2:30–6:30pm. Opening hours may vary for organisational reasons.',
            mapsQuery:'Piazza Regina Elena 75, Malè', mapsLabel:'Map', phone:'+390463901280', phoneDisplay:'0463 901280'
          },
          {t:'place',
            name:'Azienda per il Turismo Val di Sole',
            address:'Via Marconi, 7 — 38027 Malè (TN)',
            desc:'Open to the public Monday to Friday, 9:00am–12:00pm · 2:00–5:00pm.',
            mapsQuery:'Via Marconi 7, Malè', mapsLabel:'Map', phone:'+390463901280', phoneDisplay:'0463 901280'
          },
        ]
      },
      excursions:{
        title:'Excursions / Walks',
        blocks:[
          {t:'p', text:'Val di Sole is the gateway to two major nature parks: the <b>Stelvio National Park</b> and the <b>Adamello Brenta Nature Park</b> — a paradise for hiking, cycling and the outdoors.'},
          {t:'note', text:'At the Malè Tourist Information Office you can pick up very detailed brochures on hikes and walks in Val di Sole (address and hours in the “Contacts & help” section).'},
          {t:'jump', to:'contacts', icon:'pin', label:'Tourist Information Office — address and hours'},
          {t:'link', icon:'mountain', label:'Download the WALK brochure (PDF)', url:'https://www.visitvaldisole.it/website_files/cataloghi/walk-passeggiate.pdf'},
          {t:'link', icon:'mountain', label:'Download the TREK — Excursions brochure (PDF)', url:'https://www.visitvaldisole.it/website_files/cataloghi/trek-escursioni.pdf'},
          {t:'h', text:'Our recommendations, family-friendly too'},
          {t:'p', text:'Here are a few destinations we’re happy to recommend: they’re low-difficulty and suitable for children too.'},
          {t:'place', name:'Tibetan Bridge (Ponte Tibetano)', tag:'Easy · family-friendly',
            address:'Val di Rabbi (TN)',
            desc:'A spectacular suspension bridge, 100 metres long and about 60 metres high, inside the Stelvio National Park, in Val di Rabbi.',
            img:'images/escursioni-ponte-tibetano.jpg',
            mapsQuery:'Ponte Tibetano Val di Rabbi', mapsLabel:'Map'
          },
          {t:'steps', items:[
            {num:'1', title:'Starting point', text:'The <b>AL PLAN</b> car park is the most convenient starting point to reach the bridge on foot.'},
            {num:'2', title:'Access times', text:'To drive to the car park you must pass through <b>before 9:45am</b>, due to the traffic closure in Val di Rabbi (see details below).'},
            {num:'3', title:'Parking payment', text:'The car park is paid: both coins and contactless credit cards are accepted.'},
          ]},
          {t:'link', icon:'pin', label:'AL PLAN car park — Google Maps', url:'https://maps.app.goo.gl/RXmXb3xVTxcWMSKx8'},
          {t:'note', text:'Alternatively, you can reach the AL PLAN car park with the <b>Line 1 Stelviobus</b> (“Plan” stop), departing from “Plazze dei Forni” every 15 minutes, from 10:00am to 12:30pm and from 3:30pm.'},
          {t:'jump', to:'parking', icon:'car', label:'Read the details on the Val di Rabbi traffic closure'},
          {t:'place', name:'Saent Waterfalls (Cascate di Saent)', tag:'Medium difficulty · ~400 m ascent',
            address:'Val di Rabbi (TN)',
            desc:'Among the most beautiful waterfalls in Trentino, reached with a medium-difficulty walk through the woods, with an elevation gain of around 400 metres.',
            img:'images/escursioni-cascate-saent.jpg',
            mapsQuery:'Cascate di Saent Val di Rabbi', mapsLabel:'Map'
          },
          {t:'steps', items:[
            {num:'1', title:'Starting point', text:'The <b>COLER</b> car park is the most convenient starting point to reach the waterfalls on foot.'},
            {num:'2', title:'Access times', text:'To drive to the car park you must pass through <b>before 9:45am</b>, due to the traffic closure in Val di Rabbi (see details below).'},
            {num:'3', title:'Parking payment', text:'The car park is paid, <b>cash only</b>: there is no card payment line available.'},
          ]},
          {t:'link', icon:'pin', label:'COLER car park — Google Maps', url:'https://maps.app.goo.gl/FtBDaG6KFGcJLETM8'},

          {t:'p', text:'To reach this car park you can use the <b>Lakebus</b> (Pellizzano – Lago dei Caprioli), running from 4 July to 30 August, booking required. Fare €3.00, reduced to €2.00 with the Guest Card.'},

          {t:'p', text:'Alternatively, you can drive directly to the car park: spaces are limited* and must be booked in advance. Cost: full day (9:00am–7:00pm) €20, afternoon (12:00pm–7:00pm) €10.'},
          {t:'link', icon:'car', label:'Book a parking spot at Lago dei Caprioli', url:'https://valdisole-parkings.openmove.com/'},
          {t:'note', text:'*If you’d like to reach Rifugio Alpino Fazon, Azienda Agricola Florovivaistica Oga Casanova or Berry Farm, contact the owner directly: they’ll issue you a free pass for their car park (contacts in the “Transportation” section).'},

            address:'Madonna di Campiglio (TN)',
            desc:'One of Trentino’s most famous waterfalls, with a wide drop easily reached on foot.',

      museums:{
        title:'Museums / Culture',
        blocks:[
          {t:'p', text:'Val di Sole is home to museums and eco-museums that tell the story of old trades and traditions: mills, forges, sawmills and castles, often still working. We recommend checking seasonal opening times before visiting, as they can vary from year to year.'},
          {t:'note', text:'If you have a Trentino Guest Card, show it at the entrance: most of these museums offer a discount on the ticket price, and in some cases free admission.'},
          {t:'img', src:'images/trentino-guestcard-banner.png', alt:'Trentino Guest Card'},
          {t:'place',
            name:'Molino Ruatti (Ruatti Mill)',
            address:'Pracorno di Rabbi, 3 — 38020 Rabbi (TN)',
            desc:'The Mill preserves the working milling machinery, offering visitors an understanding of the working techniques and a glimpse into the local food culture. The 19th-century family home is also intact, with its original rooms and objects.',
            img:'images/museo-molino-ruatti.jpg',
            mapsQuery:'Molino Ruatti, Pracorno, Rabbi TN', mapsLabel:'Map', phone:'+390463903166', phoneDisplay:'0463 903166'
          },
          {t:'place',
            name:'MMape — Bee Museum',
            address:'Via al Molin, 3 — 38027 Croviana (TN)',
            desc:'A museum… as sweet as honey! Made of sounds, smells and flavours, including that of local honey, accompanied by guides ready to answer all your questions about the world of bees.',
            img:'images/museo-mmape.jpg',
            mapsQuery:'MMape Museo dell’ape, Via al Molin 3, Croviana', mapsLabel:'Map', phone:'+393283285780', phoneDisplay:'328 328 5780'
          },
          {t:'place',
            name:'Fucina Marinelli (Marinelli Forge)',
            address:'Via Trento 80 (loc. Pondasio) — 38027 Malè (TN)',
            desc:'A rare example of a pre-industrial facility, the forge surprises visitors with its incredible ability to defy time and wear: a large 1834 hammer and a double forge, still working today.',
            img:'images/museo-fucina-marinelli.jpg',
            mapsQuery:'Fucina Marinelli, Via Trento 80, Malè', mapsLabel:'Map', phone:'+390463900216', phoneDisplay:'0463 900216'
          },
          {t:'place',
            name:'Museo della Cultura Solandra (Museum of Solandra Culture)',
            address:'Via Trento, Palazzo Ex Pretura — 38027 Malè (TN)',
            desc:'A rich collection of period tools and faithful reconstructions of everyday environments, from the kitchen to the bedroom, telling the story of life in Val di Sole in the last century.',
            img:'images/museo-solandra.jpg',
            mapsQuery:'Museo della Civiltà Solandra, Via Trento, Malè', mapsLabel:'Map', phone:'+390463903166', phoneDisplay:'0463 903166'
          },
          {t:'place',
            name:'Fattore Legno (Wood Factor)',
            address:'Zona Industriale, 5 — 38027 Malè (TN)',
            desc:'An interactive, multimedia educational trail dedicated to wood, the iconic material of the Trentino forests — here you can also watch craftsmen at work.',
            img:'images/museo-fattore-legno.jpg',
            mapsQuery:'Fattore Legno, Zona Industriale 5, Malè', mapsLabel:'Map', phone:'+393283285780', phoneDisplay:'328 328 5780'
          },
          {t:'place',
            name:'Venetian Sawmill (Segheria Veneziana)',
            address:'SS.239, 103 (Dimaro) — 38025 Dimaro Folgarida (TN)',
            desc:'A water-powered sawmill dating back to at least the early 19th century, operational until 1960. An educational exhibition trail lets you admire the internal wood-and-iron mechanisms, still working today.',
            img:'images/museo-segheria-veneziana.jpg',
            mapsQuery:'Segheria Veneziana, SS239, Dimaro Folgarida', mapsLabel:'Map', phone:'+390463986113', phoneDisplay:'0463 986113'
          },
          {t:'place',
            name:'Castel Caldes (Castle Caldes)',
            address:'Via al Castello 12 (Via IV Novembre) — 38022 Caldes (TN)',
            desc:'A majestic 13th-century manor overlooking the village of Caldes, the result of a blend of Venetian, German and Lombard cultures typical of this border area of the Bishopric of Trento.',
            img:'images/museo-castel-caldes.jpg',
            mapsQuery:'Castel Caldes, Via al Castello 12, Caldes', mapsLabel:'Map', phone:'+390461233770', phoneDisplay:'0461 233770'
          },
        ]
      },
