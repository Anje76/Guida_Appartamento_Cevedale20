<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cevedale 20 — Guida Ospiti / Guest Guide</title>
<meta name="description" content="Guida digitale per gli ospiti di Cevedale 20, Malè, Val di Sole">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#ECE4DB;
    --panel:#F8F2E7;
    --forest:#33513A;
    --forest-dk:#233A29;
    --forest-lt:#4E6D53;
    --gold:#E3A53A;
    --gold-dk:#C7862A;
    --clay:#A8633D;
    --clay-dk:#8B4E2E;
    --ink:#2A2420;
    --ink-soft:#5B5346;
    --line:#E1D5B8;
    --line-soft:#EBE1CB;
    --danger:#B4482F;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow:0 10px 30px -12px rgba(43,36,25,.25);
    --shadow-sm:0 4px 14px -6px rgba(43,36,25,.2);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -10%, #FFFDF6 0%, var(--cream) 55%),
      var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Baloo 2',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- App shell ---------- */
  .app{max-width:560px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:40px;}

  .topbar{
    display:flex; align-items:center; justify-content:flex-end;
    padding:14px 18px 0; margin-top:-58px;
    position:relative; z-index:2;
  }
  .langbar{display:flex; gap:6px; background:rgba(252,248,239,.9); backdrop-filter:blur(4px); border:1px solid var(--line); border-radius:999px; padding:3px; box-shadow:var(--shadow-sm);}
  .langbar button{
    border:none; background:transparent; padding:6px 11px; border-radius:999px;
    font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; letter-spacing:.03em;
  }
  .langbar button.active{background:var(--forest); color:#fff;}

  /* ---------- Hero ---------- */
  .hero-banner{width:100%;}
  .hero-banner img{width:100%; height:auto; display:block;}
  .hero{padding:14px 20px 6px; text-align:center;}
  .ridge{
    width:100%; height:34px; margin:6px 0 2px;
  }
  .hero h1{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; margin:10px 0 4px; color:var(--forest-dk);
    letter-spacing:.01em;
  }
  .hero p{margin:0; color:var(--ink-soft); font-size:14.5px; line-height:1.5; padding:0 6px;}

  .tap-hint{
    text-align:center; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--forest-lt); font-weight:700; margin:22px 0 12px;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    padding:0 16px 10px;
  }
  @media (min-width:460px){ .grid{grid-template-columns:repeat(3,1fr);} }
  .tile{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius-md);
    padding:16px 8px 12px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; text-align:center;
    box-shadow:var(--shadow-sm);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .tile:active{transform:scale(.96);}
  .tile:hover{border-color:var(--gold); box-shadow:0 10px 22px -10px rgba(227,165,58,.45);}
  .tile-icon{
    width:44px; height:44px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#EFE3C6,#E7D6AE);
    color:var(--forest-dk);
  }
  .tile-icon svg{width:23px; height:23px;}
  .tile-label{font-size:11.5px; font-weight:700; color:var(--ink); line-height:1.25;}

  /* ---------- Footer / contact CTA ---------- */
  .cta-wrap{padding:8px 16px 0;}
  .cta{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--forest); color:#fff; border:none;
    padding:15px; border-radius:999px; width:100%;
    font-weight:700; font-size:14.5px; letter-spacing:.02em; cursor:pointer;
    box-shadow:0 12px 24px -10px rgba(51,81,58,.55);
  }
  .cta svg{width:17px;height:17px;}

  .hostline{text-align:center; font-size:12px; color:var(--ink-soft); margin-top:16px;}
  .hostline b{color:var(--forest-dk);}

  /* ---------- Detail sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(35,29,22,.42);
    opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:40;
  }
  .sheet-overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:560px;
    background:var(--cream);
    border-radius:26px 26px 0 0;
    max-height:92vh; overflow:hidden;
    display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 -20px 50px -10px rgba(20,16,10,.4);
    z-index:41;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-grabber{width:38px; height:4px; background:var(--line); border-radius:99px; margin:10px auto 0;}
  .sheet-head{
    display:flex; align-items:center; gap:12px; padding:12px 18px 12px;
    border-bottom:1px solid var(--line-soft);
  }
  .sheet-head .icon{
    width:38px; height:38px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#EFE3C6,#E7D6AE); color:var(--forest-dk);
  }
  .sheet-head .icon svg{width:20px;height:20px;}
  .sheet-head h2{font-family:'Baloo 2',sans-serif; font-size:18.5px; margin:0; color:var(--forest-dk);}
  .sheet-close{
    margin-left:auto; border:none; background:var(--panel); border:1px solid var(--line);
    width:32px; height:32px; border-radius:50%; cursor:pointer; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .sheet-body{padding:16px 18px 30px; overflow-y:auto;}

  /* content blocks */
  .b-p{font-size:14.5px; line-height:1.6; color:var(--ink); margin:0 0 12px;}
  .b-h{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; color:var(--forest-dk); margin:18px 0 8px; display:flex; align-items:center; gap:7px;}
  .b-h:first-child{margin-top:2px;}
  .b-h .mtick{width:14px;height:10px; flex:none;}
  .b-list{margin:0 0 14px; padding:0; list-style:none;}
  .b-list li{
    font-size:14.5px; line-height:1.55; color:var(--ink); margin-bottom:8px; padding-left:20px; position:relative;
  }
  .b-list li:before{
    content:""; position:absolute; left:0; top:8px; width:7px; height:7px; border-radius:2px;
    background:var(--gold); transform:rotate(45deg);
  }
  .b-note{
    background:#FBF1DA; border:1px solid #EBD6A0; border-left:4px solid var(--gold-dk);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:13.8px; line-height:1.55; margin:0 0 14px; color:var(--ink);
  }
  .b-warn{
    background:#FCEBE4; border:1px solid #EFC1AE; border-left:4px solid var(--danger);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:13.8px; line-height:1.55; margin:0 0 14px; color:#6E2A16;
  }
  .b-ph{
    border:1.5px dashed #C9BB98; border-radius:var(--radius-sm); padding:12px 14px; margin:0 0 14px;
    font-size:13px; line-height:1.5; color:var(--ink-soft); background:rgba(255,255,255,.4);
  }
  .b-ph b{color:var(--clay-dk);}
  .b-link{
    display:flex; align-items:center; gap:10px; text-decoration:none;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 14px; margin:0 0 10px; font-size:14px; font-weight:600; color:var(--forest-dk);
  }
  .b-link svg{width:17px;height:17px; flex:none; color:var(--gold-dk);}
  .b-link .arrow{margin-left:auto; width:14px;height:14px; color:var(--ink-soft);}
  .b-img{margin:0 0 14px;}
  .b-img img{
    width:100%; display:block; border-radius:var(--radius-sm); border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
  }
  .b-img .cap{font-size:12px; color:var(--ink-soft); text-align:center; margin-top:6px; line-height:1.4;}
  .b-map{margin:0 0 14px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow-sm);}
  .b-map iframe{width:100%; height:220px; display:block; border:none;}
  .b-brand{
    display:block; text-decoration:none;
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-sm); overflow:hidden; margin:0 0 14px; box-shadow:var(--shadow-sm);
  }
  .b-brand .logostrip{background:#1267AA; padding:18px 20px; text-align:center;}
  .b-brand .logostrip img{max-width:220px; width:60%; height:auto; display:inline-block;}
  .b-brand .row{display:flex; align-items:center; gap:10px; padding:12px 14px;}
  .b-brand .tag{flex:1; font-size:12.5px; color:var(--ink-soft); line-height:1.4;}
  .b-brand .arrow{width:14px;height:14px; color:var(--ink-soft); flex:none;}
  .b-code{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--forest-dk); color:#fff; border-radius:var(--radius-sm); padding:13px 14px; margin:0 0 14px;
  }
  .b-code .lbl{font-size:11.5px; opacity:.75; text-transform:uppercase; letter-spacing:.08em; margin-bottom:3px;}
  .b-code .val{font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:700; letter-spacing:.04em;}
  .b-code button{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff;
    border-radius:8px; padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer; flex:none;
  }
  .b-contact{
    display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:12px 14px; margin:0 0 10px;
  }
  .b-contact .av{
    width:38px;height:38px;border-radius:50%; background:linear-gradient(160deg,var(--forest-lt),var(--forest-dk));
    color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Baloo 2'; flex:none;
  }
  .b-contact .info{flex:1; min-width:0;}
  .b-contact .name{font-weight:700; font-size:14px; color:var(--ink);}
  .b-contact .sub{font-size:12.5px; color:var(--ink-soft);}
  .b-contact .acts{display:flex; gap:6px; flex:none;}
  .b-contact .acts a{
    width:32px;height:32px; border-radius:50%; background:var(--forest); color:#fff;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
  }
  .b-contact .acts a svg{width:15px;height:15px;}
  .b-hours{width:100%; border-collapse:collapse; margin:0 0 14px; font-size:13.5px;}
  .b-hours td{padding:6px 4px; border-bottom:1px solid var(--line-soft);}
  .b-hours td:first-child{font-weight:600; color:var(--forest-dk);}
  .b-hours td:last-child{text-align:right; color:var(--ink-soft);}
  .b-weather{
    background:linear-gradient(160deg,var(--forest),var(--forest-dk)); color:#fff; border-radius:var(--radius-md);
    padding:18px; margin:0 0 14px;
  }
  .b-weather .row{display:flex; align-items:center; justify-content:space-between;}
  .b-weather .temp{font-family:'Baloo 2'; font-size:38px; font-weight:700;}
  .b-weather .loc{font-size:13px; opacity:.85;}
  .b-weather .days{display:flex; justify-content:space-between; margin-top:14px; gap:6px;}
  .b-weather .day{text-align:center; font-size:11.5px; opacity:.9; flex:1;}
  .b-weather .day b{display:block; font-size:14px; margin-top:2px;}

  .b-form textarea, .b-form input{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 12px;
    font-family:inherit; font-size:14px; margin-bottom:10px; background:var(--panel); color:var(--ink);
  }
  .b-form label{font-size:12.5px; font-weight:700; color:var(--forest-dk); display:block; margin-bottom:5px;}
  .b-form button{
    width:100%; background:var(--clay); color:#fff; border:none; border-radius:999px; padding:13px;
    font-weight:700; font-size:14px; cursor:pointer;
  }

  .divider{
    height:1px; background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px); margin:18px 0;
  }

  ::-webkit-scrollbar{width:0;}
  :focus-visible{outline:2.5px solid var(--gold-dk); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="hero-banner">
    <img src="logo.png" alt="Cevedale 20 logo">
  </div>
  <div class="topbar">
    <div class="langbar" id="langbar"></div>
  </div>

  <div class="hero">
    <h1 id="t-title">Benvenuti!</h1>
    <p id="t-subtitle"></p>
  </div>

  <div class="tap-hint" id="t-hint">Tocca un'icona</div>
  <div class="grid" id="grid"></div>

  <div class="cta-wrap">
    <button class="cta" id="ctaContact">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span id="t-cta">Contattaci</span>
    </button>
    <div class="hostline" id="t-hostline"></div>
  </div>
</div>

<div class="sheet-overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-grabber"></div>
  <div class="sheet-head">
    <div class="icon" id="sheetIcon"></div>
    <h2 id="sheetTitle"></h2>
    <button class="sheet-close" id="sheetClose" aria-label="Chiudi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script>
/* =========================================================
   ICONS (inline SVG, stroke-based, shared style)
   ========================================================= */
const ICONS = {
  home:`<path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-6h4v6"/>`,
  pin:`<path d="M12 21s7-6.1 7-11.2A7 7 0 0 0 5 9.8C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/>`,
  key:`<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2.5 2.5"/>`,
  rules:`<rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>`,
  wifi:`<path d="M3 8.5a15 15 0 0 1 18 0"/><path d="M6.3 12.2a10.5 10.5 0 0 1 11.4 0"/><path d="M9.5 15.8a6 6 0 0 1 5 0"/><circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none"/>`,
  plug:`<path d="M9 3v5M15 3v5M6.5 8h11l-1 5.5a5 5 0 0 1-9 0Z"/><path d="M12 17.5V21"/>`,
  bolt:`<path d="M12 3 5 13h6l-1 8 7-10h-6z"/>`,
  trash:`<path d="M5 7h14M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M7 7l1 13a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/>`,
  car:`<path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16M6.5 16v2M17.5 16v2"/><circle cx="7.5" cy="16" r="1.4" fill="currentColor" stroke="none"/><circle cx="16.5" cy="16" r="1.4" fill="currentColor" stroke="none"/>`,
  info:`<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/>`,
  mountain:`<path d="M3 19 9.5 8l3.2 5 2-3L21 19Z"/><circle cx="7" cy="7" r="1.3"/>`,
  heart:`<path d="M12 20s-7-4.4-9.4-8.7A5 5 0 0 1 12 6a5 5 0 0 1 9.4 5.3C19 15.6 12 20 12 20Z"/>`,
  camera:`<path d="M4 8h3l1.5-2h7L17 8h3v11H4Z"/><circle cx="12" cy="13.5" r="3.3"/>`,
  bus:`<rect x="4" y="4" width="16" height="13" rx="2.5"/><path d="M4 11h16M8 17v2M16 17v2"/><circle cx="8" cy="8.3" r="0" /><circle cx="7.5" cy="14" r=".9" fill="currentColor" stroke="none"/><circle cx="16.5" cy="14" r=".9" fill="currentColor" stroke="none"/>`,
  tag:`<path d="M12.5 4H5v7.5L14.5 21l7.5-7.5L12.5 4Z"/><circle cx="9" cy="8" r="1.3" fill="currentColor" stroke="none"/>`,
  chat:`<path d="M4 5h16v11H9l-4 4V5Z"/><path d="M8 9.5h8M8 12.5h5"/>`,
  gear:`<circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M4.9 12H3M21 12h-1.9M6 6l1.5 1.5M16.5 16.5 18 18M18 6l-1.5 1.5M7.5 16.5 6 18"/>`,
  cloud:`<path d="M7.5 18a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17.4 9.6 3.8 3.8 0 0 1 17 17.9z"/>`,
  mail:`<rect x="4" y="5.5" width="16" height="13" rx="2"/><path d="m5 7 7 5.5L19 7"/>`,
  phone:`<path d="M6.6 4h3l1.4 4.2-2 1.6a12 12 0 0 0 5.2 5.2l1.6-2 4.2 1.4v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4.6 6.2 2 2 0 0 1 6.6 4Z"/>`,
  arrow:`<path d="M9 6l6 6-6 6"/>`,
  copy:`<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>`,
  check:`<path d="M20 6 9 17l-5-5"/>`,
  suitcase:`<rect x="4" y="8" width="16" height="11" rx="2"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M4 13h16"/>`,
};
function icon(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.info}</svg>`; }

/* mountain ridge tick used in section headings */
const MTICK = `<svg class="mtick" viewBox="0 0 20 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 11 6 3l3 5 2-3 8 6"/></svg>`;

/* =========================================================
   CONTENT — one object per language. Add a language by
   copying the "en" object, translating the strings, and
   adding a button in LANGS below.
   ========================================================= */
const LANGS = [
  {code:'it', label:'IT'},
  {code:'en', label:'EN'},
];

const MAPS = {
  address: 'https://goo.gl/maps/K9Th2YR95PNBmDfk8',
  crm: 'https://goo.gl/maps/X9xyFnYqPgE7Awp18',
};

function T(it, en){ return {it, en}; }

const DATA = {
  it: {
    title:'Benvenuti a Cevedale 20!',
    subtitle:'Il vostro rifugio a Malè, nel cuore della Val di Sole. Tutte le informazioni per il soggiorno, in un unico posto.',
    hint:'Tocca le icone / tap on the icons',
    cta:'Contattaci',
    hostline:'Un rifugio di <b>Angelo & Silvia</b> — Val di Sole, Trentino',
    sheetContactTitle:'Contattaci',
    closeLabel:'Chiudi',
    nav:[
      {id:'welcome', icon:'home', label:'Benvenuto'},
      {id:'location', icon:'pin', label:'Posizione'},
      {id:'checkin', icon:'key', label:'Check-in & Check-out'},
      {id:'rules', icon:'rules', label:'Regole della casa'},
      {id:'wifi', icon:'wifi', label:'Wi‑Fi'},
      {id:'appliances', icon:'plug', label:'Elettrodomestici'},
      {id:'emergency', icon:'bolt', label:'Emergenze in casa'},
      {id:'waste', icon:'trash', label:'Rifiuti'},
      {id:'parking', icon:'car', label:'Parcheggio & ZTL'},
      {id:'faq', icon:'info', label:'Info / FAQ'},
      {id:'excursions', icon:'mountain', label:'Escursioni & Tour'},
      {id:'tips', icon:'heart', label:'Consigli locali'},
      {id:'attractions', icon:'camera', label:'Cosa visitare'},
      {id:'weather', icon:'cloud', label:'Meteo'},
      {id:'transport', icon:'bus', label:'Trasporti'},
      {id:'discounts', icon:'tag', label:'Sconti convenzionati'},
      {id:'guestbook', icon:'chat', label:'Lascia un feedback'},
      {id:'contacts', icon:'gear', label:'Contatti & aiuto'},
    ],
    sections:{
      welcome:{
        title:'Benvenuto',
        blocks:[
          {t:'p', text:'Gentili Ospiti, benvenuti in Val di Sole! Siamo Angelo e Silvia e siamo felici di ospitarvi a <b>Cevedale 20</b>, il vostro rifugio a Malè.'},
          {t:'p', text:'In questa piccola guida digitale trovate tutto il necessario per il soggiorno: come raggiungere l’appartamento, come entrare, le regole della casa, la gestione dei rifiuti e tanti consigli per vivere al meglio la valle.'},
          {t:'note', text:'Toccate un’icona nella schermata principale per aprire la sezione che vi interessa. Potete tornare alla home in qualsiasi momento con la freccia o chiudendo la scheda.'},
          {t:'p', text:'Vi auguriamo un soggiorno pieno di aria buona, montagne e relax!'},
        ]
      },
      location:{
        title:'Posizione',
        blocks:[
          {t:'p', text:'L’appartamento si trova a Malè, in <b>via IV Novembre 16</b>, presso la “Galleria Cevedale”.'},
          {t:'mapembed', query:'Via IV Novembre 16, 38027 Malè TN'},
          {t:'link', icon:'pin', label:'Apri l’indirizzo su Google Maps', url:MAPS.address},
          {t:'img', src:'images/edificio-parcheggio.jpg', alt:'Edificio con ingresso Galleria e posto auto n.20', caption:'L’edificio visto dalla strada: a sinistra l’ingresso della Galleria, a destra il posto auto n. 20'},
          {t:'h', text:'Parcheggio riservato'},
          {t:'p', text:'Avete a disposizione un posto auto riservato, segnalato con righe gialle, adiacente allo spigolo posteriore destro dell’edificio, in corrispondenza di un cartello con indicato il numero “20”. Si raggiunge girando attorno all’edificio in senso orario.'},
          {t:'img', src:'images/mappa-parcheggio.jpg', alt:'Mappa satellitare con percorso verso il posto auto riservato', caption:'Percorso (in rosso) verso il posto auto riservato n. 20; in verde i parcheggi gratuiti senza numero'},
          {t:'p', text:'Davanti all’ingresso della galleria sono disponibili ulteriori posti auto gratuiti, segnalati con righe gialle, privi di numero identificativo.'},
          {t:'h', text:'Ingresso alla Galleria Cevedale'},
          {t:'p', text:'L’ingresso dell’appartamento è all’interno della Galleria Cevedale, accanto al Bar Cevedale.'},
          {t:'img', src:'images/ingresso-galleria.jpg', alt:'Scalinata d’ingresso alla Galleria Cevedale', caption:'L’ingresso della Galleria Cevedale, accanto al Bar Cevedale'},
        ]
      },
      checkin:{
        title:'Check-in & Check-out',
        blocks:[
          {t:'h', text:'Come entrare'},
          {t:'note', text:'Per l’indirizzo, il parcheggio e le foto dell’ingresso, vedi la sezione “Posizione”.'},
          {t:'p', text:'Il portone della Galleria rimane aperto solitamente dalle <b>8 alle 18</b>: basta spingere in avanti per accedere alle scale. Negli altri orari dovrete usare le chiavi per aprirlo.'},
          {t:'p', text:'Salite al <b>1° piano</b> (disponibile anche l’ascensore), girate nel corridoio a destra e troverete l’ingresso alla seconda porta a destra — appartamento 20, campanello “FLAMINI-GIANGRANDI”.'},
          {t:'img', src:'images/portone-condominio.jpg', alt:'Portone d’ingresso al condominio', caption:'Il portone d’ingresso al condominio, al 1° piano'},
          {t:'h', text:'La cassetta di sicurezza'},
          {t:'p', text:'A lato della porta trovate una piccola cassetta di sicurezza. Aprite il coperchio nero verso il basso, inserite la combinazione (che vi verrà comunicata il giorno del check-in) e ruotate il pomellino in alto in senso orario.'},
          {t:'img', src:'images/cassetta-sicurezza.jpg', alt:'Istruzioni per aprire la cassetta di sicurezza', caption:'Per aprire: inserite il codice di 4 cifre e ruotate il pomellino in senso orario. Per chiudere: ruotate in senso antiorario e riportate la combinazione a 0‑0‑0‑0'},
          {t:'p', text:'Troverete 3 chiavi: la più lunga apre la porta dell’appartamento; le due corte aprono il portone della galleria e la porta di uscita al piano terra sul lato destro dell’edificio, verso il posto auto privato (comoda per portare le valigie).'},
          {t:'code', label:'Codice cassetta di sicurezza', value:'fornito al check-in'},
          {t:'warn', text:'Al termine, richiudete la cassetta di sicurezza, ruotate il pomellino in senso antiorario e riportate la combinazione a 0‑0‑0‑0. Vi preghiamo di non lasciare mai a vista la combinazione che vi viene fornita.'},
          {t:'h', text:'Al check-out (entro le 10:00)'},
          {t:'list', items:[
            'Non lasciare rifiuti in casa',
            'Riporre le tessere per la gestione rifiuti e il telecomando TV nell’espositore di legno',
            'Chiudere le finestre',
            'Spegnere il riscaldamento (interruttore “off”, termostato impostato a 5°C)',
            'Liberare l’appartamento entro le 10:00',
            'Riporre le chiavi dell’appartamento nella cassetta di sicurezza',
            'Segnalarci qualsiasi disguido o problema riscontrato',
          ]},
          {t:'note', text:'Se siete rimasti soddisfatti, una recensione su Airbnb ci farebbe davvero piacere (facoltativo, naturalmente) 💛'},
        ]
      },
      rules:{
        title:'Regole della casa',
        blocks:[
          {t:'p', text:'Per garantire un soggiorno sereno a voi e ai prossimi ospiti, vi chiediamo di rispettare alcune semplici regole.'},
          {t:'ph', text:'✏️ <b>Da completare a cura del proprietario:</b> numero massimo di ospiti, politica su animali domestici, divieto di fumo, orario di silenzio, divieto di feste/eventi, eventuale tassa di soggiorno.'},
          {t:'h', text:'Uso della cucina'},
          {t:'p', text:'Per evitare sovraccarichi e distacchi dell’impianto elettrico, vi preghiamo di <b>non utilizzare il piano cottura contemporaneamente</b> ad altri elettrodomestici di elevato consumo energetico (forno, lavatrice, asciugacapelli, aspirapolvere). Dettagli completi nella sezione “Elettrodomestici”.'},
          {t:'h', text:'Rifiuti'},
          {t:'p', text:'A Malè la raccolta differenziata è obbligatoria. Trovate tutte le indicazioni nella sezione “Rifiuti”.'},
        ]
      },
      wifi:{
        title:'Wi‑Fi',
        blocks:[
          {t:'warn', text:'Purtroppo non siamo in grado di fornire una connessione Wi‑Fi all’interno dell’appartamento.'},
          {t:'h', text:'Wi‑Fi gratuito nel centro di Malè'},
          {t:'p', text:'A pochi passi dall’appartamento potete usufruire di <b>TrentinoWiFi</b>, il servizio di connessione gratuita della Provincia Autonoma di Trento, attivo in molte piazze e punti del centro di Malè.'},
          {t:'brand', name:'TrentinoWiFi', logo:'images/trentinowifi-logo.png', tagline:'Il servizio Free Wifi di qualità del nostro territorio', url:'https://www.trentinowifi.it/'},
          {t:'h', text:'Come funziona'},
          {t:'list', items:[
            'Cercate la rete “TrentinoWiFi” tra le reti Wi‑Fi disponibili sul telefono o computer',
            'La prima volta effettuate una breve registrazione gratuita',
            'Una volta registrati, potrete collegarvi automaticamente ovunque in Trentino sia presente il segnale TrentinoWiFi',
            'La navigazione è gratuita, senza limiti di tempo e senza pubblicità',
          ]},
          {t:'note', text:'Per assistenza sul servizio TrentinoWiFi: numero verde 800 22 80 40, dal lunedì al venerdì, dalle 8:00 alle 17:00.'},
          {t:'link', icon:'wifi', label:'Vai al sito TrentinoWiFi', url:'https://www.trentinowifi.it/'},
        ]
      },
      appliances:{
        title:'Elettrodomestici',
        blocks:[
          {t:'h', text:'Piano cottura a induzione'},
          {t:'p', text:'Nel mobile accanto al frigo trovate 2 pentole “Abert”, 1 casseruola “Ikea” e 3 padelle antiaderenti compatibili con l’induzione. Anche la caffettiera moka Barazzoni è compatibile, ma non va usata con potenza superiore a 5 (altrimenti va in errore).'},
          {t:'warn', text:'Per evitare sovraccarichi e distacchi dell’impianto elettrico, non utilizzate il piano cottura contemporaneamente ad altri elettrodomestici di elevato consumo (forno, lavatrice, asciugacapelli, aspirapolvere).'},
          {t:'p', text:'Vi consigliamo di usare al massimo due piastre, con potenza complessiva non superiore a 10‑12 (esempio: piastra con pentola dell’acqua a 6‑7, tegame col sugo a 5‑4).'},
          {t:'note', text:'Se sul display compare la scritta “lo”, avete inavvertitamente inserito il blocco di sicurezza: tenete premuto qualche secondo il simbolo a forma di chiave per sbloccarlo. Le istruzioni complete si trovano nel cassetto centrale del mobile con TV in soggiorno.'},
          {t:'h', text:'Altri elettrodomestici'},
          {t:'ph', text:'✏️ Da completare: istruzioni per lavatrice, forno, condizionatore/riscaldamento, TV e Netflix, macchina del caffè. Potete aggiungere qui foto o brevi video-guida.'},
        ]
      },
      emergency:{
        title:'Emergenze in casa',
        blocks:[
          {t:'h', text:'Se salta la corrente'},
          {t:'p', text:'È possibile riattivarla con gli interruttori vicini alla porta d’ingresso, oppure dall’interruttore del contatore generale, che si trova in una stanza al piano seminterrato: uscendo dall’ascensore al piano -1, è la porta subito a destra. Il contatore è in alto a destra, identificato dal numero “20” e dalla targhetta “FLAMINI-GIANGRANDI”.'},
          {t:'h', text:'Kit di primo soccorso ed estintore'},
          {t:'ph', text:'✏️ Da completare: dove si trovano il kit di primo soccorso e l’estintore in appartamento.'},
          {t:'h', text:'Valvole di acqua e gas'},
          {t:'ph', text:'✏️ Da completare: posizione della valvola generale dell’acqua e dell’eventuale rubinetto del gas, con istruzioni su come chiuderli in caso di emergenza.'},
          {t:'h', text:'Numeri utili'},
          {t:'p', text:'Per qualsiasi emergenza sanitaria, incendio o pubblica sicurezza chiamate il <b>112</b> (numero unico di emergenza). Trovate altri contatti utili nella sezione “Contatti & aiuto”.'},
        ]
      },
      waste:{
        title:'Rifiuti',
        blocks:[
          {t:'p', text:'A Malè vige un sistema di raccolta differenziata <b>obbligatorio</b>, con consegna diretta al Centro di Raccolta. Vi chiediamo di essere responsabili nella gestione dei rifiuti.'},
          {t:'h', text:'Umido (organico)'},
          {t:'p', text:'Potete svuotare liberamente il sacchetto dell’umido nei bidoni marroni all’ingresso del Poliambulatorio, a circa 20 metri dall’appartamento.'},
          {t:'warn', text:'Attenzione: bisogna sollevare il coperchio piccolo e rotondo, non il coperchio grande e quadrato.'},
          {t:'h', text:'Indifferenziato'},
          {t:'p', text:'Nello stesso punto trovate una campana-collettore in muratura per l’indifferenziato, che si apre con la card che trovate nell’espositore di legno sul mobile della TV in soggiorno.'},
          {t:'note', text:'Gli svuotamenti di indifferenziato sono contingentati dal Comune: effettuatene al massimo 2‑3 alla settimana (consigliamo di inserire nel collettore anche 2 sacchetti insieme).'},
          {t:'h', text:'Plastica, carta e vetro'},
          {t:'p', text:'Vanno separati adeguatamente e portati per lo smaltimento al Centro Recupero Materiali di Malè, usando la stessa tessera.'},
          {t:'link', icon:'pin', label:'Centro Recupero Materiali — Google Maps', url:MAPS.crm},
          {t:'hours', rows:[
            ['Lunedì','chiuso (vedi Eco Isola)'],
            ['Martedì','08:30–12:00 · 14:00–17:30'],
            ['Mercoledì','08:30–12:00 · 14:00–17:30'],
            ['Giovedì','08:30–12:00 · 14:00–17:30'],
            ['Venerdì','chiuso (vedi Eco Isola)'],
            ['Sabato','08:30–12:00 · 14:00–17:30'],
            ['Domenica','chiuso (vedi Eco Isola)'],
          ]},
          {t:'p', text:'<b>Eco Isola</b> (esterna al Centro): permette di conferire carta e cartone, multimateriale leggero e imballaggi in vetro anche nei giorni di chiusura del centro. È attiva solo nei giorni di chiusura, con spegnimento alle 22:00, e si accede con la tessera del rifiuto secco.'},
          {t:'note', text:'Non siete obbligati ad andare ogni giorno al centro di recupero: potete farlo anche l’ultimo (o penultimo) giorno del soggiorno, compatibilmente con gli orari — non occorrono più di 15 minuti.'},
        ]
      },
      parking:{
        title:'Parcheggio & ZTL',
        blocks:[
          {t:'p', text:'Il vostro posto auto riservato, segnalato con righe gialle, si trova adiacente allo spigolo posteriore destro dell’edificio, presso il cartello con il numero “20”. Si raggiunge girando attorno all’edificio in senso orario.'},
          {t:'p', text:'Davanti alla galleria trovate ulteriori posti gratuiti, segnalati con righe gialle e senza numero identificativo.'},
          {t:'link', icon:'pin', label:'Apri la posizione su Google Maps', url:MAPS.address},
          {t:'ph', text:'✏️ Da verificare/completare: eventuali Zone a Traffico Limitato (ZTL) nel centro di Malè, orari di accesso e parcheggi a pagamento nelle vicinanze.'},
        ]
      },
      faq:{
        title:'Info / FAQ',
        blocks:[
          {t:'h', text:'A che ora posso entrare/uscire?'},
          {t:'ph', text:'✏️ Da completare con gli orari di check-in e check-out concordati con l’ospite (il check-out è comunque richiesto entro le 10:00, vedi sezione “Check-in & Check-out”).'},
          {t:'h', text:'Posso portare animali domestici?'},
          {t:'ph', text:'✏️ Da completare con la vostra policy sugli animali.'},
          {t:'h', text:'C’è un ascensore?'},
          {t:'p', text:'Sì, oltre alle scale è disponibile un ascensore fino al 1° piano dell’appartamento.'},
          {t:'h', text:'Dove butto i rifiuti?'},
          {t:'p', text:'Trovate tutte le indicazioni nella sezione “Rifiuti”, con mappe e orari del Centro di Raccolta.'},
          {t:'h', text:'C’è la lavatrice?'},
          {t:'ph', text:'✏️ Da completare: disponibilità lavatrice/stendino, detersivo incluso o meno.'},
        ]
      },
      excursions:{
        title:'Escursioni & Tour',
        blocks:[
          {t:'p', text:'La Val di Sole è la porta d’accesso a due grandi parchi naturali: il <b>Parco Nazionale dello Stelvio</b> e il <b>Parco Naturale Adamello Brenta</b>. Un paradiso per chi ama camminare, pedalare e stare all’aria aperta.'},
          {t:'h', text:'Idee per le vostre giornate'},
          {t:'list', items:[
            'Pista ciclopedonale della Val di Sole, lungo il fiume Noce, adatta a tutta la famiglia',
            'Rafting e canyoning sul fiume Noce, tra i più amati delle Alpi',
            'Passo del Tonale e ghiacciaio Presena, per escursioni in quota anche d’estate',
            'Cascate di Saent, in Val di Rabbi, tra le più suggestive del Trentino',
            'Passeggiate ai piedi del Gruppo del Cevedale e dell’Ortles-Cevedale',
          ]},
          {t:'ph', text:'✏️ Consiglio: aggiungete qui i vostri itinerari preferiti, con link a tracce GPS (es. Komoot o Outdooractive) e livello di difficoltà.'},
          {t:'p', text:'Per informazioni aggiornate su sentieri, rifugi e condizioni meteo in quota, vi consigliamo di passare dall’Ufficio Informazioni dell’APT Val di Sole (vedi sezione “Contatti & aiuto”).'},
        ]
      },
      tips:{
        title:'Consigli locali',
        blocks:[
          {t:'p', text:'Alcuni piccoli consigli da chi vive in valle.'},
          {t:'ph', text:'✏️ Da completare con i vostri ristoranti, malghe, bar e negozi del cuore — un tocco personale che gli ospiti apprezzano sempre.'},
          {t:'note', text:'Suggerimento: per ogni consiglio potete aggiungere nome del locale, cosa ordinare e se conviene prenotare.'},
        ]
      },
      attractions:{
        title:'Cosa visitare',
        blocks:[
          {t:'p', text:'Alcuni spunti per le vostre giornate in Val di Sole (verificate sempre orari e aperture stagionali).'},
          {t:'list', items:[
            'Centro storico di Malè, con le sue case affrescate',
            'Chiesa di San Vigilio, tra le più antiche della valle',
            'Cascate di Saent, in Val di Rabbi',
            'Il Parco Nazionale dello Stelvio, tra i più grandi d’Europa',
            'Passo del Tonale e i suoi panorami sulle Alpi',
          ]},
          {t:'ph', text:'✏️ Da completare con musei, castelli e attrazioni specifiche della zona, con orari aggiornati.'},
        ]
      },
      weather:{
        title:'Meteo',
        blocks:[
          {t:'weather'},
          {t:'h', text:'Giornata di pioggia? Ecco qualche idea'},
          {t:'list', items:[
            'Terme di Pejo o Rabbi, per un pomeriggio di relax',
            'Musei e centri visitatori dei Parchi (Stelvio / Adamello Brenta)',
            'Passeggiata nella Galleria Cevedale e nei negozi del centro di Malè',
            'Una cioccolata calda in uno dei bar del paese',
          ]},
        ]
      },
      transport:{
        title:'Trasporti',
        blocks:[
          {t:'h', text:'Autobus'},
          {t:'p', text:'La Val di Sole è collegata dalla rete di Trentino Trasporti. La fermata più vicina è a pochi minuti a piedi dall’appartamento.'},
          {t:'ph', text:'✏️ Da completare: nome della fermata più vicina e linee utili (es. per Trento, Dimaro, Passo Tonale).'},
          {t:'h', text:'Taxi & noleggio'},
          {t:'ph', text:'✏️ Da completare con i contatti di taxi o servizi navetta locali che consigliate.'},
          {t:'h', text:'In treno'},
          {t:'p', text:'La stazione ferroviaria più vicina è Trento, da cui proseguire in autobus verso la Val di Sole.'},
        ]
      },
      discounts:{
        title:'Sconti convenzionati',
        blocks:[
          {t:'p', text:'Se avete accordi con attività locali (colazione, noleggio bici, ristoranti…), potete elencarli qui con il relativo codice sconto riservato ai vostri ospiti.'},
          {t:'ph', text:'✏️ Da completare: nome dell’attività, sconto riservato e codice da mostrare.'},
        ]
      },
      guestbook:{
        title:'Lascia un feedback',
        blocks:[
          {t:'p', text:'C’è qualcosa che non ha funzionato o un suggerimento per migliorare il soggiorno? Scriveteci: ci teniamo davvero.'},
          {t:'form'},
          {t:'note', text:'Se invece siete rimasti soddisfatti, una recensione su Airbnb ci farebbe molto piacere 💛'},
        ]
      },
      contacts:{
        title:'Contatti & aiuto',
        blocks:[
          {t:'h', text:'I vostri host'},
          {t:'contact', name:'Angelo Giangrandi', sub:'+39 327 686 7296', phone:'+393276867296', email:'anje76@gmail.com'},
          {t:'contact', name:'Silvia Flamini', sub:'+39 328 415 1764', phone:'+393284151764', email:'silviaflam76@gmail.com'},
          {t:'h', text:'Numeri utili'},
          {t:'list', items:[

            'Ambulatorio stagionale di Malè attivo giugno–settembre e dicembre–aprile',

          {t:'p', text:'Dear guests, welcome to Val di Sole! We’re Angelo and Silvia, and we’re delighted to host you at <b>Cevedale 20</b>, your retreat in Malè.'},

          {t:'link', icon:'pin', label:'Open the address on Google Maps', url:MAPS.address},

          {t:'p', text:'You have a reserved parking spot, marked with yellow lines, next to the back-right corner of the building, by a sign showing the number “20”. Reach it by going around the building clockwise.'},
          {t:'img', src:'images/mappa-parcheggio.jpg', alt:'Satellite map with the route to the reserved parking spot', caption:'Route (in red) to the reserved parking spot n. 20; in green the free spots with no number'},
          {t:'p', text:'In front of the gallery’s entrance there are further free parking spots, marked with yellow lines but without an identifying number.'},
          {t:'h', text:'Galleria Cevedale entrance'},
          {t:'p', text:'The apartment entrance is inside the Galleria Cevedale, next to the Bar Cevedale.'},
          {t:'img', src:'images/ingresso-galleria.jpg', alt:'Steps up to the Galleria Cevedale entrance', caption:'The entrance to the Galleria Cevedale, next to the Bar Cevedale'},
        ]
      },
      checkin:{
        title:'Check-in & Check-out',
        blocks:[
          {t:'h', text:'Getting in'},

/* =========================================================
   RENDER
   ========================================================= */
let lang = (navigator.language||'it').slice(0,2)==='en' ? 'en' : 'it';

function initLangBar(){
  const bar=document.getElementById('langbar');
  bar.innerHTML='';
  LANGS.forEach(l=>{
    const b=document.createElement('button');
    b.textContent=l.label;
    b.className = l.code===lang ? 'active':'';
    b.onclick=()=>{ lang=l.code; renderAll(); };
    bar.appendChild(b);
  });
}

function renderHome(){
  const d=DATA[lang];
  document.documentElement.lang=lang;
  document.getElementById('t-title').textContent=d.title;
  document.getElementById('t-subtitle').textContent=d.subtitle;
  document.getElementById('t-hint').textContent=d.hint;
  document.getElementById('t-cta').textContent=d.cta;
  document.getElementById('t-hostline').innerHTML=d.hostline;

  const grid=document.getElementById('grid');
  grid.innerHTML='';
  d.nav.forEach(item=>{
    const tile=document.createElement('button');
    tile.className='tile';
    tile.setAttribute('aria-label', item.label);
    tile.innerHTML=`<span class="tile-icon">${icon(item.icon)}</span><span class="tile-label">${item.label}</span>`;
    tile.onclick=()=>openSection(item.id);
    grid.appendChild(tile);
  });
}

function blockHTML(b){
  switch(b.t){
    case 'p': return `<p class="b-p">${b.text}</p>`;
    case 'h': return `<div class="b-h">${MTICK}${b.text}</div>`;
    case 'list': return `<ul class="b-list">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'note': return `<div class="b-note">${b.text}</div>`;
    case 'warn': return `<div class="b-warn">${b.text}</div>`;
    case 'ph': return `<div class="b-ph">${b.text}</div>`;
    case 'link': return `<a class="b-link" href="${b.url}" target="_blank" rel="noopener">${icon(b.icon||'pin')}<span>${b.label}</span><span class="arrow">${icon('arrow')}</span></a>`;
    case 'img': return `<div class="b-img"><img src="${b.src}" alt="${b.alt||''}" loading="lazy">${b.caption? `<div class="cap">${b.caption}</div>`:''}</div>`;
    case 'mapembed': return `<div class="b-map"><iframe src="https://www.google.com/maps?q=${encodeURIComponent(b.query)}&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>`;
    case 'brand': return `<a class="b-brand" href="${b.url}" target="_blank" rel="noopener"><div class="logostrip"><img src="${b.logo}" alt="${b.name}" loading="lazy"></div><div class="row"><span class="tag">${b.tagline}</span><span class="arrow">${icon('arrow')}</span></div></a>`;
    case 'code': return `<div class="b-code"><div><div class="lbl">${b.label}</div><div class="val" id="code-${cid()}">${b.value}</div></div>${b.value.match(/^[A-Za-z0-9•\-]+$/)? '' : ''}</div>`;
    case 'contact': return `<div class="b-contact">
        <div class="av">${b.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
        <div class="info"><div class="name">${b.name}</div><div class="sub">${b.sub}</div></div>
        <div class="acts">
          <a href="tel:${b.phone}" aria-label="call">${icon('phone')}</a>
          <a href="mailto:${b.email}" aria-label="email">${icon('mail')}</a>
        </div>
      </div>`;
    case 'hours': return `<table class="b-hours">${b.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    case 'weather': return `<div class="b-weather" id="weatherBox">
        <div class="row"><div><div class="loc">Malè, Val di Sole</div><div class="temp" id="wTemp">—</div></div><div id="wIcon" style="width:46px;height:46px;">${icon('cloud')}</div></div>
        <div class="days" id="wDays"></div>
      </div>`;
    case 'form': return `<div class="b-form">
        <label>${lang==='it'?'Il tuo nome':'Your name'}</label>
        <input id="fbName" type="text" placeholder="${lang==='it'?'Nome':'Name'}">
        <label>${lang==='it'?'Messaggio':'Message'}</label>
        <textarea id="fbMsg" rows="4" placeholder="${lang==='it'?'Scrivici qui...':'Write to us here...'}"></textarea>
        <button id="fbSend" type="button">${lang==='it'?'Invia via email':'Send via email'}</button>
      </div>`;
    default: return '';
  }
}
let _cid=0; function cid(){ return ++_cid; }

function openSection(id){
  const d=DATA[lang];
  const nav=d.nav.find(n=>n.id===id);
  const sec=d.sections[id];
  document.getElementById('sheetIcon').innerHTML=icon(nav.icon);
  document.getElementById('sheetTitle').textContent=sec.title;
  document.getElementById('sheetBody').innerHTML=sec.blocks.map(blockHTML).join('');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.body.style.overflow='hidden';
  location.hash = id;

  // wire dynamic bits
  const sendBtn=document.getElementById('fbSend');
  if(sendBtn){
    sendBtn.onclick=()=>{
      const name=document.getElementById('fbName').value||'';
      const msg=document.getElementById('fbMsg').value||'';
      const subject=encodeURIComponent('Cevedale 20 — feedback');
      const body=encodeURIComponent(`${name}\n\n${msg}`);
      window.location.href=`mailto:anje76@gmail.com?subject=${subject}&body=${body}`;
    };
  }
  if(document.getElementById('weatherBox')) loadWeather();
}

function closeSection(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow='';
  history.replaceState(null,'',location.pathname+location.search);
}

function renderAll(){
  initLangBar();
  renderHome();
}

document.getElementById('overlay').onclick=closeSection;
document.getElementById('sheetClose').onclick=closeSection;
document.getElementById('ctaContact').onclick=()=>openSection('contacts');

renderAll();
if(location.hash){ const id=location.hash.slice(1); if(DATA[lang].sections[id]) setTimeout(()=>openSection(id),50); }

/* =========================================================
   WEATHER (Open-Meteo, no API key required)
   ========================================================= */
let weatherLoaded=false;
async function loadWeather(){
  const tEl=document.getElementById('wTemp');
  const daysEl=document.getElementById('wDays');
  try{
    const res=await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.357&longitude=10.918&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FRome&forecast_days=4');
    const j=await res.json();
    tEl.textContent = Math.round(j.current.temperature_2m)+'°C';
    const names = lang==='it' ? ['Oggi','Dom1','Dom2','Dom3'] : ['Today','Day 2','Day 3','Day 4'];
    const daysArr = j.daily.time.map((t,i)=>i);
    const labels = j.daily.time.map((t,i)=> i===0 ? (lang==='it'?'Oggi':'Today') : new Date(t).toLocaleDateString(lang==='it'?'it-IT':'en-GB',{weekday:'short'}));
    daysEl.innerHTML = daysArr.map(i=>`<div class="day">${labels[i]}<b>${Math.round(j.daily.temperature_2m_max[i])}°</b></div>`).join('');
  }catch(e){
    tEl.textContent='—';
    daysEl.innerHTML=`<div class="day">${lang==='it'?'Meteo non disponibile':'Weather unavailable'}</div>`;
  }
}

/* copy-to-clipboard for any future code chip with a value that's an actual code */
document.addEventListener('click', (e)=>{
  const btn=e.target.closest('[data-copy]');
  if(!btn) return;
  navigator.clipboard.writeText(btn.dataset.copy);
});
