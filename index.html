      transport:{
        title:'Transportation',
        blocks:[
          {t:'p', text:'You can easily get around Val di Sole without a car: cycle paths, bike-friendly trains and buses, themed shuttles and regional bus lines connect the whole valley.'},
          {t:'link', icon:'bus', label:'Download the routes & timetables booklet (PDF)', url:'https://www.visitvaldisole.it/website_files/cataloghi/bike%2Btrain%2Bbus.pdf'},
          {t:'h', text:'Cycle path'},
          {t:'p', text:'It runs along the Noce river for <b>35 km</b>, from Cogolo/Vermiglio to Mostizzolo, plus a further <b>3 km</b> stretch in Val di Rabbi. Suitable for the whole family.'},
          {t:'h', text:'Bikebus'},
          {t:'p', text:'Bus services equipped for bike transport (max 25 bikes and 5 e-bikes), with mandatory booking:'},
          {t:'list', items:[
            'Dimaro – Madonna di Campiglio – Carisolo: Tuesday, Thursday and Saturday',
            'Mezzana – Fucine – Cogolo – Peio Fonti: Monday and Friday',
            'Mezzana – Fucine – Passo Tonale: Wednesday and Sunday',
          ]},
          {t:'link', icon:'key', label:'Book the Bikebus online', url:'https://valdisole.openmove.com'},
          {t:'h', text:'Biketrain and railway connections'},
          {t:'p', text:'The <b>Biketrain</b> (Mostizzolo – Mezzana) is a daily train/bus service equipped for bike transport (up to 80 bikes in August), with no bike-seat booking required.'},
          {t:'p', text:'The local <b>Trento – Malè – Mezzana</b> railway line runs every day. During the MTB World Championships at Daolasa (27–30 August 2026), trains will run every 30 minutes between Malè and Mezzana.'},
          {t:'h', text:'Local themed shuttles'},
          {t:'p', text:'<b>Lakebus</b> (Pellizzano – Lago dei Caprioli): running from 4 July to 30 August, booking required. Fare €3.00, reduced to €2.00 with the Guest Card.'},
          {t:'link', icon:'pin', label:'Pellizzano stop (Parco Sama) — Google Maps', url:'https://maps.app.goo.gl/qnCEZ88Jefo7BrFy6'},
          {t:'link', icon:'key', label:'Book your seat on the Lakebus', url:'https://valdisole.openmove.com/'},
          {t:'p', text:'Alternatively, to reach Lago dei Caprioli you can drive to the car park about 400 metres from the lake: spaces are limited* and must be booked in advance. Cost: full day (9:00am–7:00pm) €20, afternoon (12:00pm–7:00pm) €10.'},
          {t:'link', icon:'car', label:'Book a parking spot at Lago dei Caprioli', url:'https://valdisole-parkings.openmove.com/'},
          {t:'note', text:'*If you’d like to reach Rifugio Alpino Fazon (<a href="tel:+393276635124">327 663 5124</a>), Azienda Agricola Florovivaistica Oga Casanova (<a href="tel:+393293771335">329 377 1335</a>) or Berry Farm (<a href="tel:+393336238830">333 623 8830</a>), contact the owner: they’ll issue you a free pass for their car park.'},
          {t:'p', text:'<b>Summerbus</b>: running from 25 July to 23 August on the Malè – Peio Fonti and Malè – Vermiglio Nord routes, no booking needed.'},
          {t:'p', text:'<b>Stelviobus Val di Rabbi</b>: running from 27 June to 6 September to access the Stelvio National Park. Includes Line 1 (Plazze dei Forni – Còler, every 15‑30 minutes) and Lines 2, 3 and 4 to the mountain huts.'},
          {t:'note', text:'Lines 2, 3 and 4 have limited seats: book by phone by the day before, calling <a href="tel:+393466726120">346 672 6120</a>, between 9:00am and 5:00pm.'},
          {t:'link', icon:'bus', label:'Stelviobus routes and timetables (PDF)', url:'https://www.visitvaldisole.it/website_files/trasporti/Stelviobus.pdf'},
          {t:'jump', to:'parking', icon:'car', label:'Details on the Val di Rabbi traffic closure'},
          {t:'h', text:'Regional bus lines'},
          {t:'p', text:'Ordinary regional bus lines connect Malè with Val di Rabbi (B640), Bolentina (B641) and Folgarida/Madonna di Campiglio (B642).'},
          {t:'p', text:'Many services require a ticket, but are free or discounted for holders of the Val di Sole Guest Card or the Trentino Guest Card, once the travel pass has been validated.'},
          {t:'h', text:'Trentino Guest Card: free transport'},
          {t:'img', src:'images/trentino-guestcard-banner.png', alt:'Trentino Guest Card'},
          {t:'p', text:'The Trentino Guest Card gives unlimited access to the Trentino Trasporti public transport network, both urban (Trento, Rovereto, Alto Garda and Pergine) and regional. You can also travel on regional trains on the Brenner, Valsugana and Trento‑Malè lines, on routes starting and ending within the Province of Trento (ES, EC, IC and Espressi trains cannot be used).'},
          {t:'warn', text:'To travel you must <b>validate your ride</b> every time, using the “Mio Trentino” app by scanning the QR code on board or at the station. If you don’t have a smartphone, you can request a paper transport card from the tourist offices or from us, to be validated on board or at the station together with the Guest Card.'},
          {t:'link', icon:'globe', label:'Full details on transport with the Guest Card', url:'https://www.visittrentino.info/it/articoli/guest-card/trasporti'},
          {t:'link', icon:'info', label:'Video guide: how to validate your ride with the app', url:'https://www.visittrentino.info/video/guest-card/6128190/video-thumb__6128190__contentvideo/APP%20-%20tessera.mp4'},
          {t:'h', text:'Taxi & rentals'},
          {t:'p', text:'Here are the handiest taxi contacts in the various villages of the valley.'},
          {t:'list', items:[
            '<b>Malè:</b> Florian Viaggi <a href="tel:+393294664632">329 466 4632</a> · Stablum Franco <a href="tel:+393398122893">339 812 2893</a>',
            '<b>Caldes:</b> Taxi Viaggi Valentinelli <a href="tel:+393357089777">335 708 9777</a> / <a href="tel:+393404293385">340 429 3385</a>',
            '<b>Monclassico:</b> Ivana Taxi <a href="tel:+393388560244">338 856 0244</a>',
            '<b>Commezzadura:</b> Viaggi Cornelio <a href="tel:+390463974470">0463 974470</a> / <a href="tel:+393356304877">335 630 4877</a>',
            '<b>Mezzana:</b> Taxi Ravelli <a href="tel:+393341414275">334 141 4275</a> · Zappa Viaggi <a href="tel:+393336727238">333 672 7238</a>',
          ]},
        ]
      },
      summerActivities:{
        title:'Summer Activities',
        blocks:[
          {t:'p', text:'Val di Sole in summer is an open-air playground: cycle paths, rivers for rafting, trails for every level, and alpine lakes. Here are a few ideas, from our guests’ own recommendations to the valley’s best-equipped outdoor centres.'},
          {t:'h', text:'Recommended by our guests'},
          {t:'place',
            name:'Flying Park',
            address:'Località Regazzini — Malè (TN)',
            desc:'The best adventure park in Val di Sole! Fun for adults and children alike, with 17 different courses, 7 climbing routes, and a thrilling 15-metre zip-line jump. It’s right next to Osteria del Bosco (see the “Restaurants” section).',
            img:'images/estate-flying-park.jpg',
            mapsQuery:'Flying Park, Malè', mapsLabel:'Map', phone:'+393924860806', phoneDisplay:'392 486 0806',
            url:'https://www.flyingpark.it/it/', urlLabel:'flyingpark.it'
          },
          {t:'place',
            name:'Agritur Bontempelli',
            address:'Località Pressenago — 38020 Pellizzano (TN)',
            desc:'A farm stay with a riding stable at the heart of Val di Sole, where horses are the real stars: horseback rides, riding lessons, pony rides for little ones and, in winter, the charming horse-drawn sleigh ride.',
            img:'images/estate-agritur-bontempelli.jpg',
            mapsQuery:'Agritur Bontempelli, Pressenago, Pellizzano', mapsLabel:'Map', phone:'+393386078681', phoneDisplay:'338 607 8681',
            email:'info@maneggio.net', url:'https://agriturbontempelli.com', urlLabel:'agriturbontempelli.com'
          },
          {t:'place',
            name:'Acqua Center Val di Sole',
            address:'Via alla Croce, 1 — 38027 Malè (TN)',
            desc:'Three indoor pools, open year-round in any weather. The large windows give you a view of the Brenta Dolomites for a pleasant, relaxing swim, and the outdoor sun terrace is perfect for a well-earned moment of rest.',
            img:'images/estate-acqua-center.jpg',
            mapsQuery:'Acquacenter Val di Sole, Via alla Croce, Malè', mapsLabel:'Map', phone:'+390463902545', phoneDisplay:'0463 902545'
          },
          {t:'warn', text:'Flip-flops and a swimming cap are mandatory to access the pools (you can also buy them on site). Practical tip: bring a 50-cent coin, it’s needed as a deposit for the changing-room lockers.'},
          {t:'note', text:'Acqua Center’s opening hours change between summer and winter season: always check the current times before you go.'},
          {t:'h', text:'Storie di Legno e Arte del Balocco (Wooden Toy Stories & Craft)'},
          {t:'place',
            name:'Storie di Legno e Arte del Balocco',
            tag:'Highly recommended if you have kids',
            address:'Segheria Veneziana, Loc. Molini — 38027 Malè (TN)',
            desc:'In a characteristic Trentino sawmill, Maurizio Bontempelli — known as “l’Om delle Storie” (the Storyteller Man) — welcomes children into a hands-on experience they’re unlikely to forget: the wooden toy they build will be a lasting memory of that special morning.',
            img:'images/estate-storie-legno-balocco.jpg',
            hours:[
            ['Arte del Balocco — Mondays, 9:30am','29 June to 31 August'],
            ['Storie di Legno — Tuesdays, 10:00am','30 June to 1 September'],
          ]
          },
          {t:'note', text:'“Arte del Balocco” (Craft of the Toy): a wood-turning demonstration with the Storyteller Man — free, indoors, no booking required. “Le storie di legno” (Wooden Stories): storytelling with the Storyteller Man and a children’s workshop building a wooden toy (€10 per toy) — indoors, no booking required.'},
          {t:'link', icon:'pin', label:'Map — Segheria Veneziana', url:'https://maps.app.goo.gl/81tMN9hnWBwhSSFu9'},
          {t:'p', text:'The Storyteller Man also holds another appointment, in central Malè:'},
          {t:'place',
            name:'Racconti dell’Antica Corte (Tales of the Old Courtyard)',
            address:'Piazza Cesare Battisti — 38027 Malè (TN)',
            desc:'A journey through fairy tales, legends, traditional music and period instruments with the Storyteller Man, rediscovering old traditions and the art of imagination. Indoors, suitable for all ages, no booking required.',
            img:'images/estate-racconti-antica-corte.jpg',
            hours:[
            ['Every Wednesday','6:00–7:00pm'],
          ]
          },
          {t:'link', icon:'pin', label:'Map — Piazza Cesare Battisti, Malè', url:'https://maps.app.goo.gl/5nCN6UMkh2CaVsyS6'},
          {t:'place',
            name:'Area Faunistica Runcal (Runcal Wildlife Area)',
            img:'images/area-faunistica-runcal.jpg',
            address:'Peio — Località Runcal, on the SP87 road (Peio Fonti–Peio Paese) (TN)',
            desc:'A Stelvio National Park area where deer and roe deer let visitors watch them up close: information panels explain the habits of alpine wildlife and the Park’s conservation projects.',
            phone:'+390463909775', phoneDisplay:'0463 909775'
          },
          {t:'link', icon:'pin', label:'Map', url:'https://maps.app.goo.gl/YNpKGPj48MYXz8hw5'},
          {t:'note', text:'Tip: if you can choose a time, go at 4:00pm — that’s when the keepers feed the deer and roe deer, making it easier to see them up close. This isn’t a zoo: the area’s purpose is to rehabilitate rescued wild animals ahead of their return to the wild.'},
          {t:'h', text:'Rafting and adventure sports on the Noce river'},
          {t:'p', text:'Val di Sole is among Italy’s most loved rafting destinations: the Noce river offers 28 navigable kilometres, suited both to those after the most thrilling rapids and to those who prefer calmer stretches. Two well-established centres in the valley organise these and many other outdoor activities.'},
          {t:'place',
            name:'Trentino Wild — Rafting & Outdoor',
            logo:'images/estate-logo-trentinowild.png',
            address:'Via Gole, 412 — 38025 Dimaro Folgarida (TN)',
            desc:'Italy’s largest outdoor centre, with further locations in Caldes and Croviana. Rafting, hydrospeed, canyoning, canoeing, kayaking, downhill mountain biking, a tree-top adventure park, paintball, tarzaning, paragliding and climbing.',
            mapsQuery:'Trentino Wild, Via Gole 412, Dimaro Folgarida', mapsLabel:'Map', phone:'+390463973278', phoneDisplay:'0463 973278'
          },
          {t:'link', icon:'phone', label:'340 217 5873 (mobile)', url:'tel:+393402175873'},
          {t:'link', icon:'mail', label:'info@trentinowild.it', url:'mailto:info@trentinowild.it'},
          {t:'link', icon:'globe', label:'trentinowild.it', url:'https://trentinowild.it/it/'},
          {t:'place',
            name:'Ursus Adventures',
            logo:'images/estate-logo-ursusadventures.png',
            address:'Via di Sotto Pila, 6 — 38026 Ossana (TN)',
            desc:'An outdoor centre with over 50 experiences across Val di Sole and Val di Non: family rafting on the Noce, canyoning, tarzaning, tandem paragliding, climbing, mountain biking, canoe/kayak/SUP tours, and original formats like AstroExperience and alpaca trekking.',
            mapsQuery:'Ursus Adventures, Via di Sotto Pila 6, Ossana', mapsLabel:'Map', phone:'+390463636175', phoneDisplay:'0463 636175'
          },
          {t:'link', icon:'phone', label:'334 846 8540 (mobile)', url:'tel:+393348468540'},
          {t:'link', icon:'mail', label:'info@ursusadventures.it', url:'mailto:info@ursusadventures.it'},
          {t:'link', icon:'globe', label:'ursusadventures.it', url:'https://www.ursusadventures.it/'},
          {t:'h', text:'Other ideas'},
          {t:'list', items:[
            'The Val di Sole cycle path along the Noce river, suitable for the whole family',
            'Pejo and Rabbi thermal spas, for a relaxing afternoon',
            'Walks and hikes: see also the “Excursions & Tours” section',
          ]},
          {t:'ph', text:'✏️ To be completed: any partnership discounts reserved for your guests at these centres, and any further personal recommendations of yours.'},
        ]
      },
      skiing:{
        title:'Skiing in Val di Sole',
        blocks:[
          {t:'p', text:'Val di Sole offers every opportunity for those who love skiing. The Folgarida‑Marilleva ski area, thanks to its connection with Madonna di Campiglio and Pinzolo, forms an immense ski area of over 150 km of slopes.'},
          {t:'h', text:'The closest lift'},
          {t:'place',
            name:'Telecabina Daolasa (Daolasa cable car)',
            address:'Piazzale Cabinovia Daolasa — Commezzadura (TN)',
            desc:'The quickest lift to reach from the apartment: it’s 7.2 km away, reachable in 10 minutes by car or 15 minutes by ski bus. Paid parking on site.',
            img:'images/ski-foto-daolasa.jpg',
            mapsQuery:'Piazzale Cabinovia Daolasa, Commezzadura', mapsLabel:'Map'
          },
          {t:'h', text:'The free ski bus'},
          {t:'p', text:'You can also reach Daolasa with the free ski bus, Line 2 Malè–Daolasa–Malè. The stop is just 20 metres from the apartment (“Coop” stop), opposite the Poliambulatorio, where the brown organic-waste bins are also located.'},
          {t:'img', src:'images/ski-foto-fermata-coop.jpg', alt:'The “Coop” ski bus stop', caption:'The “Coop” stop, 20 metres from the apartment'},
          {t:'img', src:'images/ski-orari-skibus.jpg', alt:'Line 2 ski bus timetable Malè-Daolasa', caption:'Line 2 timetable, winter season from 4 December 2025 to 11 April 2026'},
          {t:'note', text:'Free ride until seats run out, individuals only. Some runs and stops are only active in specific periods: always check the notes on the timetable.'},
          {t:'h', text:'Ski and Snowboard School'},
          {t:'place',
            name:'Scuola Italiana Sci Val di Sole (Val di Sole Ski School)',
            logo:'images/ski-logo-scuoladisci.png',
            address:'Piazzale Telecabina Daolasa and Alpe Daolasa – Val Mastellina (on the slopes)',
            desc:'If you need an instructor, this is the most practical choice: it has a location in the tunnel at the base of the cable car and one at the arrival point of the ski slopes.',
            phone:'+393773923548', phoneDisplay:'377 392 3548',
            hours:[
            ['Daolasa — every day','8:30am–6:00pm'],
            ['Val Mastellina (on the slopes) — every day','9:00am–3:30pm'],
          ]
          },
          {t:'note', text:'We strongly recommend booking lessons in advance, by email or through the website.'},
          {t:'link', icon:'mail', label:'info@scuolascivaldisole.com', url:'mailto:info@scuolascivaldisole.com'},
          {t:'link', icon:'globe', label:'scuolascivaldisole.com', url:'https://www.scuolascivaldisole.com'},
          {t:'h', text:'Equipment rental'},
          {t:'p', text:'If you need to rent skis or a snowboard, we recommend one of these options — we suggest booking your equipment ahead of time, especially in peak season.'},
          {t:'place',
            name:'VDS Sport Malè — the shop under the house',
            logo:'images/ski-logo-vdssport.png',
            address:'Ground floor of the building, at the Galleria Cevedale — Malè (TN)',
            desc:'An excellent rental/sales service for high-quality equipment, managed by the expert Daniele. They do not provide snowboards.',
            phone:'+390463902003', phoneDisplay:'0463 902003',
            email:'vdssport@alice.it'
          },
          {t:'place',
            name:'Promescaiol — directly on the slopes',
            logoFull:'images/ski-logo-promescaiol.png',
            address:'Piazzale Telecabina Daolasa and Alpe Daolasa – Val Mastellina (on the slopes)',
            desc:'Two locations: one at the base of the cable car and one at the arrival point of the ski slopes. It also offers a convenient equipment storage service at altitude, in heated lockers — no need to carry your skis all the way up.',
            phone:'+393280253924', phoneDisplay:'328 025 3924'
          },
          {t:'img', src:'images/ski-foto-promescaiol.jpg', alt:'Promescaiol heated ski storage lockers', caption:'Promescaiol’s heated ski storage, on the slopes'},
          {t:'warn', text:'Note: Promescaiol has two shops, one in Daolasa and one in Folgarida. When booking online, select “Promescaiol Outdoor Adventure Life Alpe Daolasa”, or use the direct link below.'},
          {t:'link', icon:'globe', label:'promescaiol.com', url:'https://promescaiol.com'},
          {t:'link', icon:'key', label:'Book the Daolasa rental', url:'https://promescaiol.com/landing-noleggio-daolasa/'},
          {t:'link', icon:'mail', label:'info@promescaiol.com', url:'mailto:info@promescaiol.com'},
          {t:'place',
            name:'SkiArt',
            logo:'images/ski-logo-skiart.png',
            address:'Piazzale Telecabina Daolasa (tunnel at the base of the cable car)',
            desc:'Only located at the Daolasa cable car station, but it also offers a convenient equipment storage service.',
            phone:'+390463974483', phoneDisplay:'0463 974483',
            url:'https://skiart.it', urlLabel:'skiart.it', email:'info@skiart.it'
          },
          {t:'place',
            name:'Boarder King Shop',
            logoFull:'images/ski-logo-boarderking.png',
            address:'Piazzale Telecabina Daolasa (tunnel at the base of the cable car)',
            desc:'A point of reference for over 10 years for snowboard rental, for every level, from beginners to the most demanding riders. Freeride snowboards, splitboards and ARTVA kits are also available.',
            phone:'+393493054673', phoneDisplay:'349 305 4673',
            url:'https://boarderking.it', urlLabel:'boarderking.it', email:'info@boarderking.it'
          },
          {t:'note', text:'Tip: always check the snow report and high-altitude weather conditions before heading up to the slopes.'},
          {t:'h', text:'More than just skiing'},
          {t:'jumpCard', to:'winterActivities', anchor:'snowparkKids', img:'images/snowpark-family-park-folgarida.jpg', name:'SNOWPARK for kids and teens', desc:'Tubing, sledging, inflatables and slopes for first-time skiers: discover all the snow playgrounds in the valley.', cta:'Discover the Snowparks'},
        ]
      },
      winterActivities:{
        title:'Winter Activities',
        blocks:[
          {t:'p', text:'Val di Sole in winter offers much more than skiing: nativity scenes scattered across town, ice skating and Christmas markets bring the valley to life from late November through January. Here are a few events not to miss.'},
          {t:'place',
            name:'Ossana — The Village of 1000 Nativity Scenes',
            tag:'Nativity scenes & Christmas markets',
            img:'images/invernali-borgo-presepi-ossana.jpg',
            address:'Ossana (TN)',
            desc:'Let the red thread guide you — like a comet’s tail — through more than 1,600 handcrafted nativity scenes scattered along the village lanes and the walls of Castello San Michele. The trail is free and open every day from 10:00am to 10:00pm, generally from late November to early January; on weekends, Christmas markets add vin brulè and local crafts to the mix.',
            mapsQuery:'Ossana borgo dei 1000 presepi, Ossana TN', mapsLabel:'Map', phone:'+390463901280', phoneDisplay:'0463 901280'
          },
          {t:'note', text:'Entry to Castello San Michele in Ossana (€4), the heart of the nativity trail, is free for Trentino Guest Card holders.'},
          {t:'link', icon:'globe', label:'Updated dates and programme for the Village of 1000 Nativity Scenes', url:'https://www.visitvaldisole.it/it/eventi/ossana-il-borgo-dei-presepi'},
          {t:'place',
            name:'Malè Ice Stadium',
            tag:'Ice skating',
            img:'images/invernali-stadio-ghiaccio-male.jpg',
            address:'Loc. Molin, 4 — 38027 Malè (TN)',
            desc:'An open-air rink measuring 30x60 metres, with a retractable roof, stands, a bar and changing rooms. Glide across the ice, try a few spins, or take on a game of broomball or hockey — skate rental and sharpening are available on site, along with beginner skating and hockey courses. Usually open from December to March.',
            mapsQuery:'Stadio del Ghiaccio, Loc. Molin, Malè', mapsLabel:'Map', phone:'+390463901905', phoneDisplay:'0463 901905'
          },
          {t:'place',
            name:'The Valley of Nativity Scenes',
            tag:'San Bernardo — Val di Rabbi',
            img:'images/invernali-valle-presepi-rabbi.jpg',
            address:'Ufficio Informazioni Rabbi Vacanze, Fraz. San Bernardo — 38020 Rabbi (TN)',
            desc:'Can you find all 100 nativity scenes scattered across the villages of Val di Rabbi? Pick up the map at the San Bernardo Information Office, hunt for the scenes along the trail, and fill in your card with the numbered stickers you find: collect them all and you’ll receive your own Val di Rabbi gadget. We recommend visiting at dusk, when the nativity lights come on and the walk becomes even more magical.',
            mapsQuery:'Ufficio Informazioni Rabbi Vacanze, San Bernardo, Rabbi', mapsLabel:'Map', phone:'+390463985048', phoneDisplay:'0463 985048'
          },
          {t:'note', text:'San Bernardo Information Office hours: Monday–Friday 9:00am–12:00pm, Saturday 9:00am–12:00pm and 3:00–6:00pm, closed Sunday.'},
          {t:'h', text:'Snowpark for kids', id:'snowparkKids'},
          {t:'p', text:'Val di Sole has no shortage of snow playgrounds designed just for children, with tubing, sledging, inflatables and slopes for first-time skiers.'},
          {t:'place',
            name:'Bruscadela', tag:'Reachable by car', distance:'Best value',
            address:'Via della Prada, 31 — 38029 Vermiglio (TN)',
            desc:'A snow park with a thrilling tubing and airboard run, plus sledge and bob descents, connected by a convenient conveyor lift for the way back up.',
            img:'images/snowpark-bruscadela.jpg',
            phone:'+390463758200', phoneDisplay:'0463 758200'
          },
          {t:'link', icon:'phone', label:'Mobile — 393 832 7645', url:'tel:+393938327645'},
          {t:'link', icon:'phone', label:'Mobile — 348 760 2758', url:'tel:+393487602758'},
          {t:'link', icon:'pin', label:'Map', url:'https://maps.app.goo.gl/c9zK5Ao5Trc251Cs6'},
          {t:'hours', rows:[
            ['21 Dec 2025 – 6 Jan 2026','Every day 10:00am–5:00pm'],
            ['From 7 January 2026','Saturday and Sunday 10:00am–4:30pm'],
            ['Other days and evenings','On request, groups included'],
          ]},
          {t:'note', text:'Paid entry: full price €5, reduced (up to age 16) €3, children up to age 5 €3 (must be accompanied by an adult, who enters free). Season pass €25 (rubber ring/airboard use excluded). Rubber ring and airboard rental: €3 per hour.'},
          {t:'place',
            name:'Biancaneve Snowpark', tag:'Reachable by car',
            address:'Peio — Cogolo, Località Biancaneve (TN)',
            desc:'A snow playground for families: sledging and tubing runs, colourful games, a beginner ski slope and a snowboard camp, all served by a ski lift and conveyor belts. Watch the kids from the panoramic terrace over a hot drink, or join in — thanks to the on-site ski instructors it also suits older children taking their first steps on snow. On Thursday evenings the run stays floodlit.',
            img:'images/snowpark-biancaneve.jpg',
            phone:'+393517611352', phoneDisplay:'351 761 1352'
          },
          {t:'link', icon:'pin', label:'Map', url:'https://maps.app.goo.gl/8ufN8arf4u4GwHMm7'},
          {t:'place',
            name:'Fantaski', tag:'Reachable by car',
            address:'Passo Tonale — Pontedilegno-Tonale Ski Area (TN)',
            desc:'Sledge and bob runs, snow tubing and plenty of colourful inflatables; two easy slopes for beginners, served by conveyor belts. It also offers a mini-club and babysitting service in heated areas, for worry-free parents.',
            img:'images/snowpark-fantaski.jpg',
            mapsQuery:'Fantaski, Passo Tonale', phone:'+393791859237', phoneDisplay:'379 185 9237'
          },
          {t:'place',
            name:'Family Park Daolasa', tag:'Reachable only by cable car',
            address:'Commezzadura — arrival of the Daolasa cable car, Val Mastellina II (TN)',
            desc:'A playground at 2,000 metres altitude, with conveyor belts, inflatable games and an outdoor tubing run, plus a warm indoor play area with a babysitting service. The centre has a beginner’s slope and a ski-school slope served by 4 conveyor belts, with on-snow entertainment — don’t miss Snowy the fox, the Folgarida Marilleva Ski Area’s mascot.',
            img:'images/snowpark-family-park-daolasa.jpg',
            mapsQuery:'Telecabina Daolasa, Commezzadura', phone:'+390463988400', phoneDisplay:'0463 988400'
          },
          {t:'place',
            name:'Family Park Folgarida', tag:'Reachable only by cable car',
            address:'Folgarida — Località Malghet Aut, arrival of the Folgarida and Belvedere cable cars (TN)',
            desc:'A large, safe snow playground overlooking the Brenta Dolomites in a sunny spot. Equipped with two conveyor belts, two ski lifts, the Bamby chairlift, the Snowpark easy line, a snow-tubing run and a carousel. A team of professional entertainers and the mascot Snowy engage the youngest guests with baby dance and group games.',
            img:'images/snowpark-family-park-folgarida.jpg',
            mapsQuery:'Malghet Aut, Folgarida', phone:'+390463988400', phoneDisplay:'0463 988400'
          },
          {t:'note', text:'Bruscadela, Biancaneve and Fantaski are easily reachable by car; Family Park Daolasa and Family Park Folgarida, on the other hand, are up on the slopes and reachable only by cable car.'},
          {t:'warn', text:'A protective helmet is mandatory: if you have one, bring it from home. Rental is often available on site, but availability isn’t always guaranteed for everyone — Biancaneve, in particular, doesn’t offer a helmet rental service.'},
        ]
      },
      activateGuestCard:{
        title:'Activating the Trentino Guest Card',
        blocks:[
          {t:'img', src:'images/trentino-guestcard-banner.png', alt:'Trentino Guest Card'},
          {t:'p', text:'The <b>Trentino Guest Card</b> gives you free or discounted access to over 100 local activities — museums, castles, parks — plus free travel on all public transport in the province (see also the “Transportation” section). To activate it, use it and always have it with you, just download the <b>Mio Trentino</b> app.'},
          {t:'h', text:'How to activate it in 3 steps'},
          {t:'steps', items:[
            {num:'1', title:'Get your Card code', text:'Check your email — you’ll have received a Card code by email. If it hasn’t arrived, just ask us at check-in.'},
            {num:'2', title:'Download the app and link the code', text:'Download the Mio Trentino app from your app store, sign up (or log in) and enter your Card code. If you sign up with the same email the code was sent to, it will be linked automatically.'},
            {num:'3', title:'Start using it', text:'The Card can be used from the day you arrive until the day you leave, and is valid for everyone staying with you, children included.'},
          ]},
          {t:'link', icon:'key', label:'Download the Mio Trentino app (Google Play)', url:'https://play.google.com/store/apps/details?id=it.visittrentino.app.miotrentino&pcampaignid=web_share'},
          {t:'link', icon:'info', label:'Video: how to activate and use the Card', url:'https://www.visittrentino.info/video/guest-card/6140730/video-thumb__6140730__contentvideo/Animazione_16_9-IT.mp4'},
          {t:'img', src:'images/mio-trentino-app-logo.png', alt:'Mio Trentino App', width:'88px', center:true},
        ]
      },
      discounts:{
        title:'Trentino Guest Card Discounts',
        blocks:[
          {t:'img', src:'images/trentino-guestcard-banner.png', alt:'Trentino Guest Card'},
          {t:'p', text:'This section lists the main services included with the Trentino Guest Card, located in Val di Sole and Val di Peio.'},
          {t:'link', icon:'tag', label:'Full list of included services', url:'https://www.visittrentino.info/it/esperienze/trentino-guest-card/servizi-inclusi'},
          {t:'h', text:'Free services (included)'},
          {t:'p', text:'In general, the Card gives free access to many museums and castles, and free use of public transport.'},
          {t:'h', text:'Castles and Forts'},
          {t:'place',
            name:'Castello di Caldes',
            img:'images/convenzioni-castello-caldes.jpg',
            address:'Via al Castello 12 — 38022 Caldes (TN)',
            desc:'A 13th-century manor overlooking the Noce river, hosting exhibitions and cultural events in the warmer months. One free entry per Guest Card holder.',
            mapsQuery:'Castello di Caldes, Via al Castello 12, Caldes', mapsLabel:'Map', phone:'+390461233770', phoneDisplay:'0461 233770'
          },
          {t:'place',
            name:'Castello San Michele',
            img:'images/convenzioni-castello-sanmichele.jpg',
            address:'Via al Castello — 38026 Ossana (TN)',
            desc:'An imposing medieval fortress with a 25-metre keep, perched above the village of Ossana. Free entry with the Guest Card.',
            mapsQuery:'Castello San Michele, Ossana', mapsLabel:'Map', phone:'+393404183540', phoneDisplay:'340 418 3540'
          },
          {t:'place',
            name:'Forte Strino',
            img:'images/convenzioni-forte-strino.jpg',
            address:'Via Nazionale (SS.42) — 38029 Vermiglio (TN)',
            desc:'An 1860 Austro-Hungarian fort, now a museum dedicated to the White War on the Tonale front. Free entry with the Guest Card.',
            mapsQuery:'Forte Strino, Vermiglio', mapsLabel:'Map', phone:'+390463758200', phoneDisplay:'0463 758200'
          },
          {t:'h', text:'Culture and Traditions'},
          {t:'place',
            name:'Fucina Marinelli (Marinelli Forge)',
            img:'images/museo-fucina-marinelli.jpg',
            address:'Via Trento 80 (loc. Pondasio) — 38027 Malè (TN)',
            desc:'A rare example of a pre-industrial facility, the forge surprises visitors with its incredible ability to defy time and wear: a large 1834 hammer and a double forge, still working today.',
            mapsQuery:'Fucina Marinelli, Via Trento 80, Malè', mapsLabel:'Map', phone:'+390463900216', phoneDisplay:'0463 900216'
          },
          {t:'place',
            name:'Segheria Veneziana di Ortisé (Ortisé Venetian Sawmill)',
            img:'images/convenzioni-segheria-ortise.jpg',
            address:'Marilleva Mezzana — Ortisé, Via Roncio, 37 (TN)',
            desc:'An old water-powered sawmill between the hamlets of Ortisé and Menas, restored and back in full working order: across four levels you can see the saw, the original wooden gears, and the turbine driven by the nearby Rio Valletta stream.',
            mapsQuery:'Via Roncio 37, Ortisé, Mezzana', mapsLabel:'Map', phone:'+390463757588', phoneDisplay:'0463 757588'
          },
          {t:'note', text:'Guided visits on Tuesday mornings in July and August, 10:00–11:00am. Paid entry, discounted with the Guest Card.'},
          {t:'link', icon:'phone', label:'Mobile — 328 328 5780', url:'tel:+393283285780'},
          {t:'link', icon:'globe', label:'marilleva.it', url:'https://www.marilleva.it'},
          {t:'link', icon:'globe', label:'apslalveare.it', url:'https://www.apslalveare.it'},
          {t:'place',
            name:'Museo della Guerra Bianca (White War Museum)',
            img:'images/convenzioni-museo-guerra-bianca.jpg',
            address:'Vermiglio — Polo Culturale, Via di Borgo Nuovo, 15 (TN)',
            desc:'Home to a collection of First World War relics recovered on the mountains of the Tonale Pass, Adamello and Presanella, alongside an immersive multimedia installation telling the story of a soldier at the front. On request, it organises guided tours of Forte Strino and the area’s other forts.',
            mapsQuery:'Museo della Guerra Bianca, Via di Borgo Nuovo 15, Vermiglio', mapsLabel:'Map', phone:'+390463758200', phoneDisplay:'0463 758200',
            hours:[
            ['June and September','Mon–Sat 9:00am–12:00pm · 3:00–6:00pm'],
            ['July and August','Every day 9:00am–12:00pm · 3:00–6:00pm'],
          ]
          },
          {t:'note', text:'Free entry with the Guest Card. The museum is fully wheelchair accessible, with reserved parking nearby.'},
          {t:'link', icon:'globe', label:'sulletraccedellagrandeguerra.it', url:'http://www.sulletraccedellagrandeguerra.it/'},
          {t:'place',
            name:'Museo “La Guerra sulla Porta”',
            img:'images/convenzioni-museo-guerra-sulla-porta.jpg',
            address:'Salita San Rocco, 1 — 38024 Peio (TN)',
            desc:'A museum dedicated to daily life and the events of the First World War on the Tonale front, set in the historic centre of Peio Paese.',
            mapsQuery:'Museo La Guerra sulla Porta, Salita San Rocco 1, Peio', mapsLabel:'Map', phone:'+393487400942', phoneDisplay:'348 740 0942',
            url:'http://www.museopejo.it/', urlLabel:'museopejo.it'
          },
          {t:'place',
            name:'Casa dell’Ecomuseo “Piccolo Mondo Alpino”',
            img:'images/convenzioni-ecomuseo-piccolo-mondo-alpino.jpg',
            address:'Via dei Capitei, 24 — loc. Celentino, 38024 Peio (TN)',
            desc:'A small ethnographic museum telling the story of farming and pastoral life of the past, in the hamlet of Celentino in upper Val di Peio.',
            mapsQuery:'Ecomuseo Piccolo Mondo Alpino, Via dei Capitei 24, Celentino, Peio', mapsLabel:'Map', phone:'+393396179380', phoneDisplay:'339 617 9380',

          {t:'place',
            name:'Trentino Outdoor App',
            logoFull:'images/app-trentino-outdoor-icon.png',
            desc:'Download routes and itineraries to discover the area: plan your outdoor activities in Trentino to have genuine experiences.',

          {t:'p', text:'The app offers detailed descriptions, technical data, maps and downloadable GPX tracks, for both summer and winter sports.'},
          {t:'p', text:'You’ll also find information on natural attractions worth visiting, the castles and monuments richest in history, facilities for skiing or other sports, places to rent equipment, playgrounds for children, adventure parks to have fun with friends, places to eat and places to stay.'},

    sections:{
      welcome:{
        title:'Willkommen',
        blocks:[
          {t:'p', text:'Liebe Gäste, willkommen im Val di Sole! Wir sind Angelo und Silvia und freuen uns, Sie in <b>Cevedale 20</b>, Ihrem Rückzugsort in Malè, begrüßen zu dürfen.'},
          {t:'p', text:'Dieser kleine digitale Guide enthält alles, was Sie für Ihren Aufenthalt brauchen: wie Sie die Wohnung erreichen, wie Sie hineinkommen, die Hausordnung, die Müllentsorgung und viele Tipps, um das Beste aus dem Tal zu machen.'},
          {t:'note', text:'Tippen Sie auf ein Symbol im Startbildschirm, um den gewünschten Bereich zu öffnen. Sie können jederzeit über den Zurück-Pfeil oder durch Schließen des Fensters zur Startseite zurückkehren.'},
          {t:'p', text:'Wir wünschen Ihnen einen Aufenthalt voller frischer Luft, Berge und Entspannung!'},
        ]
      },
      eventsToday:{
        title:'Veranstaltungen heute',
        blocks:[
          {t:'warn', text:'⚠️ <b>Dieser Bereich befindet sich in der BETA-Testphase</b>: Er kann Fehler bei Zeiten oder Orten enthalten. Bitte überprüfen Sie die Angaben anhand der offiziellen Broschüre des Val di Sole Tourismusbüros (APT), erhältlich beim Infobüro oder online zum Download.'},
          {t:'link', icon:'pin', label:'Tourismusbüro APT — Via Marconi 7, Malè', url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Via Marconi 7, Malè')},
          {t:'link', icon:'phone', label:'Tourismusbüro anrufen — +39 0463 901280', url:'tel:+390463901280'},
          {t:'link', icon:'globe', label:'Veranstaltungsprogramm der APT Val di Sole herunterladen', url:'https://www.visitvaldisole.it/it/eventi'},
          {t:'p', text:'Veranstaltungen im Val di Sole <b>heute</b>, automatisch aktualisiert aus der Broschüre des lokalen Tourismusbüros.'},
          {t:'events_today'},
          {t:'note', text:'Quelle: Broschüre des Tourismusbüros Val di Sole (APT). Die Angaben sind auf Italienisch und können sich witterungsbedingt ändern — bitte prüfen Sie die Zeiten vorab bei den lokalen Infobüros.'},
        ]
      },
      location:{
        title:'Lage',
        blocks:[
          {t:'p', text:'Die Wohnung befindet sich in Malè, in der <b>Via IV Novembre 16</b>, innerhalb der „Galleria Cevedale“.'},
          {t:'mapembed', query:'Via IV Novembre 16, 38027 Malè TN'},
          {t:'link', icon:'pin', label:'Adresse auf Google Maps öffnen', url:MAPS.address},
          {t:'h', text:'Anreise mit dem Auto'},
          {t:'steps', items:[
            {num:'1', title:'Autobahnausfahrt', text:'Nehmen Sie die Ausfahrt „Trento Nord – Interporto“ oder „S. Michele all’Adige / Mezzocorona“ auf der <b>Brennerautobahn A22</b>.'},
            {num:'2', title:'Folgen Sie den Schildern', text:'Folgen Sie den Schildern Richtung Mezzolombardo, Cles, Malè (SS.42), in Richtung <b>Val di Non / Val di Sole</b>.'},
            {num:'3', title:'Das Gebäude Cevedale', text:'Erreichen Sie das Gebäude „Cevedale“ in der Via IV Novembre 16 in Malè (TN) — siehe Karte oben.'},
            {num:'4', title:'Reservierter Parkplatz', text:'Parken Sie auf dem reservierten Platz: Stellplatz Nr. 20, auf der rechten Gebäudeseite, ganz hinten (erreichbar, indem Sie im Uhrzeigersinn um das Gebäude gehen) — Details und Fotos weiter unten.'},
          ]},
          {t:'note', text:'<b>Wenn Sie aus Mailand kommen</b>, können Sie auch die Route Bergamo → SS.42 → Passo del Tonale in Betracht ziehen — gleiche Fahrzeit, aber ohne Autobahngebühren.'},
          {t:'img', src:'images/edificio-parcheggio.jpg', alt:'Gebäude mit Eingang zur Galleria und Parkplatz 20', caption:'Das Gebäude von der Straße aus gesehen: links der Eingang zur Galleria, rechts der Parkplatz Nr. 20'},
          {t:'h', text:'Reservierter Parkplatz'},
          {t:'p', text:'Sie verfügen über einen reservierten, mit gelben Linien markierten Parkplatz, neben der rechten hinteren Gebäudeecke, bei einem Schild mit der Nummer „20“. Erreichbar, indem Sie im Uhrzeigersinn um das Gebäude gehen.'},
          {t:'img', src:'images/mappa-parcheggio.jpg', alt:'Satellitenkarte mit der Route zum reservierten Parkplatz', caption:'Route (rot) zum reservierten Parkplatz Nr. 20; grün die kostenlosen Plätze ohne Nummer'},
          {t:'img', src:'images/parcheggio-piazzola-20.jpg', alt:'Reservierter Parkplatz Nummer 20', caption:'Der reservierte Stellplatz, mit der Nummer „20“ an der Gebäudewand gekennzeichnet'},
          {t:'p', text:'Vor dem Eingang zur Galleria gibt es weitere kostenlose, mit gelben Linien markierte Parkplätze ohne Nummer.'},
          {t:'h', text:'Eingang zur Galleria Cevedale'},
          {t:'p', text:'Der Eingang zur Wohnung befindet sich innerhalb der Galleria Cevedale, neben der Bar Cevedale.'},
          {t:'img', src:'images/ingresso-galleria.jpg', alt:'Treppe zum Eingang der Galleria Cevedale', caption:'Der Eingang zur Galleria Cevedale, neben der Bar Cevedale'},
          {t:'jump', to:'checkin', icon:'key', label:'So kommen Sie in die Wohnung'},
        ]
      },
      checkin:{
        title:'Check-in & Check-out',
        blocks:[
          {t:'h', text:'Eingang zur Galleria Cevedale'},
          {t:'p', text:'Der Eingang zur Wohnung befindet sich innerhalb der Galleria Cevedale, neben der Bar Cevedale. Adresse, Karte und Anfahrtsbeschreibung finden Sie im Bereich „Lage“.'},
          {t:'img', src:'images/ingresso-galleria.jpg', alt:'Treppe zum Eingang der Galleria Cevedale', caption:'Der Eingang zur Galleria Cevedale, neben der Bar Cevedale'},
          {t:'h', text:'So kommen Sie hinein'},
          {t:'p', text:'Das Haupttor der Galleria ist in der Regel von <b>8 bis 18 Uhr</b> geöffnet: einfach nach vorne drücken, um zur Treppe zu gelangen. Außerhalb dieser Zeiten benötigen Sie die Schlüssel.'},
          {t:'p', text:'Gehen Sie zum <b>1. Stock</b> (auch ein Aufzug ist vorhanden), biegen Sie im Flur nach rechts ab und finden Sie den Eingang an der zweiten Tür rechts — Wohnung 20, Klingel „FLAMINI-GIANGRANDI“.'},
          {t:'img', src:'images/portone-condominio.jpg', alt:'Eingangstür des Gebäudes', caption:'Die Eingangstür des Gebäudes im 1. Stock'},
          {t:'h', text:'Der Schlüsseltresor'},
          {t:'p', text:'Neben der Tür finden Sie einen kleinen Schlüsseltresor. Öffnen Sie die schwarze Abdeckung nach unten, geben Sie die Kombination ein (die Sie am Anreisetag erhalten) und drehen Sie den oberen Knopf im Uhrzeigersinn.'},
          {t:'img', src:'images/cassetta-sicurezza.jpg', alt:'Anleitung zum Öffnen des Schlüsseltresors', caption:'Zum Öffnen: 4-stelligen Code eingeben und Knopf im Uhrzeigersinn drehen. Zum Schließen: gegen den Uhrzeigersinn drehen und Kombination auf 0‑0‑0‑0 zurücksetzen'},
          {t:'p', text:'Sie finden 3 Schlüssel: der längste öffnet die Wohnungstür; die beiden kürzeren öffnen das Haupttor der Galleria sowie die Ausgangstür im Erdgeschoss auf der rechten Gebäudeseite, zum privaten Parkplatz hin (praktisch für das Gepäck).'},
          {t:'code', label:'Code des Schlüsseltresors', value:'wird beim Check-in mitgeteilt'},
          {t:'warn', text:'Schließen Sie danach den Schlüsseltresor, drehen Sie den Knopf gegen den Uhrzeigersinn und setzen Sie die Kombination auf 0‑0‑0‑0 zurück. Bitte lassen Sie die Ihnen mitgeteilte Kombination niemals sichtbar liegen.'},
          {t:'h', text:'Am Tag Ihrer Abreise bitten wir Sie'},
          {t:'list', items:[
            'Keinen Müll in der Wohnung zu hinterlassen',
            'Die Müllkarte und die TV-Fernbedienung im Holzhalter zurückzulegen',
            'Die Fenster zu schließen',
            'Die Wohnung bis 10:00 Uhr zu räumen',
            'Die Wohnungsschlüssel im Schlüsseltresor zu deponieren',
            'Uns über etwaige Probleme zu informieren',
          ]},
          {t:'note', text:'Wenn Sie zufrieden waren, würde uns eine Bewertung auf Airbnb sehr freuen (natürlich völlig freiwillig) 💛'},
        ]

      rules:{
        title:'Hausordnung',
        blocks:[
          {t:'p', text:'Um Ihnen und künftigen Gästen einen angenehmen Aufenthalt zu ermöglichen, bitten wir Sie, einige einfache Regeln zu beachten.'},
          {t:'h', text:'Nutzung der Küche'},
          {t:'p', text:'Um eine Überlastung und einen Ausfall der Elektroanlage zu vermeiden, benutzen Sie bitte <b>das Kochfeld nicht gleichzeitig</b> mit anderen stromintensiven Geräten (Backofen, Waschmaschine, Haartrockner, Staubsauger). Weitere Details im Bereich „Küche“.'},
          {t:'h', text:'Müll'},
          {t:'p', text:'In Malè ist die Mülltrennung Pflicht. Alle Anweisungen finden Sie im Bereich „Müllentsorgung“.'},
          {t:'h', text:'Rauchverbot'},
          {t:'p', text:'In der Wohnung ist das Rauchen und das Entzünden jeglicher offener Flamme (z. B. Kerzen) untersagt.'},
          {t:'h', text:'Maximale Gästezahl'},
          {t:'p', text:'Die Wohnung kann maximal 4 Gäste aufnehmen.'},
          {t:'h', text:'Kurtaxe'},
          {t:'p', text:'Die Provinzielle Kurtaxe beträgt 1 € pro Person und Nacht. Sie wird den Gästen der Unterkunft bis zu maximal 10 aufeinanderfolgenden Nächten berechnet. Kinder unter 14 Jahren und einige weitere Kategorien sind befreit. Sollten Sie glauben, dass dies auf Sie zutrifft, teilen Sie uns dies bitte mit, damit wir die Befreiung anwenden können.'},
          {t:'jump', to:'taxExemptions', icon:'info', label:'Wer nicht zahlen muss — Befreiungen ansehen'},
        ]
      },
      wifi:{
        title:'Wi‑Fi',
        blocks:[
          {t:'warn', text:'Leider können wir innerhalb der Wohnung keine Wi‑Fi-Verbindung anbieten.'},
          {t:'h', text:'Kostenloses Wi‑Fi im Zentrum von Malè'},
          {t:'p', text:'Nur wenige Schritte von der Wohnung entfernt können Sie <b>TrentinoWiFi</b> nutzen, den kostenlosen Verbindungsdienst der Autonomen Provinz Trient, der an vielen Plätzen und Orten im Zentrum von Malè verfügbar ist.'},
          {t:'brand', name:'TrentinoWiFi', logo:'images/trentinowifi-logo.png', tagline:'Der kostenlose, qualitativ hochwertige Wi‑Fi-Dienst unserer Region', url:'https://www.trentinowifi.it/'},
          {t:'h', text:'So funktioniert es'},
          {t:'list', items:[
            'Suchen Sie auf Ihrem Telefon oder Laptop unter den verfügbaren Wi‑Fi-Netzwerken nach „TrentinoWiFi“',
            'Beim ersten Mal führen Sie eine kurze kostenlose Registrierung durch',
            'Nach der Registrierung verbinden Sie sich automatisch überall in Trentino, wo das TrentinoWiFi-Signal verfügbar ist',
            'Das Surfen ist kostenlos, ohne Zeitlimit und ohne Werbung',
          ]},
          {t:'note', text:'Für Unterstützung zum TrentinoWiFi-Dienst: gebührenfreie Nummer 800 22 80 40, Montag bis Freitag, 8:00–17:00 Uhr.'},
          {t:'link', icon:'wifi', label:'Zur TrentinoWiFi-Website', url:'https://www.trentinowifi.it/'},
        ]
      },
      appliances:{
        title:'Küche',
        blocks:[
          {t:'h', text:'Induktionskochfeld'},
          {t:'p', text:'Das Kochfeld ist ein Induktionskochfeld. Im Schrank neben dem Kühlschrank finden Sie kompatible Töpfe, Kasserollen und beschichtete Pfannen. Auch die Espressokanne Barazzoni ist mit dem Induktionskochfeld kompatibel (sollte aber nicht über Leistungsstufe 5 verwendet werden, sonst erscheint eine Fehlermeldung).'},
          {t:'warn', text:'WICHTIG: Um eine Überlastung und einen Ausfall der Elektroanlage zu vermeiden, benutzen Sie bitte das Kochfeld nicht gleichzeitig mit anderen stromintensiven Geräten (Backofen, Waschmaschine, Haartrockner, Staubsauger).'},
          {t:'p', text:'Wir empfehlen, höchstens zwei Kochzonen gleichzeitig zu verwenden, mit einer auf dem Display angezeigten Gesamtleistung von höchstens 10‑12 (z. B. eine Zone mit einem Topf Wasser auf 6‑7, eine Pfanne mit Sauce auf 5‑4).'},
          {t:'img', src:'images/cucina-induzione-en.jpg', alt:'Bedienelemente des Induktionskochfelds', caption:'Die wichtigsten Bedienelemente des Kochfelds'},
          {t:'p', text:'Oben finden Sie die wichtigsten Bedienelemente des Kochfelds. Die vollständige Anleitung liegt in der mittleren Schublade des TV-Schranks im Wohnzimmer.'},
          {t:'note', text:'Wenn auf dem Display „Lo“ erscheint, haben Sie versehentlich die Kindersicherung aktiviert. Zum Entsperren halten Sie einfach das SCHLÜSSEL-Symbol einige Sekunden lang gedrückt.'},
          {t:'img', src:'images/cucina-simbolo-chiave.jpg', alt:'Schlüsselsymbol auf dem Kochfeld', caption:'Das SCHLÜSSEL-Symbol, das zum Entsperren gedrückt gehalten werden muss'},
          {t:'jump', to:'emergency', icon:'bolt', label:'Wenn die Sicherung herausspringt, siehe „Notfälle in der Wohnung“'},
        ]
      },
      emergency:{
        title:'Notfälle in der Wohnung',
        blocks:[
          {t:'h', text:'Bei Stromausfall'},
          {t:'p', text:'Sie können den Strom über die Schalter neben der Eingangstür wiederherstellen, oder über den Hauptschalter des Zählers, der sich in einem Raum im Untergeschoss befindet: aus dem Aufzug im Stockwerk -1 kommend, ist es die erste Tür rechts.'},
          {t:'img', src:'images/emergenza-stanza-contatori.jpg', alt:'Flur im Stockwerk -1 mit der Tür zum Zählerraum', caption:'Aus dem Aufzug im Stockwerk -1 kommend, befindet sich die Tür zum Zählerraum direkt rechts'},
          {t:'p', text:'Der Zähler befindet sich oben rechts, gekennzeichnet mit „20“ und dem Schild „FLAMINI-GIANGRANDI“.'},
          {t:'img', src:'images/emergenza-contatore.jpg', alt:'Stromzähler Nr. 20 im Zählerraum', caption:'Zähler Nr. 20, oben rechts in der Reihe'},
          {t:'h', text:'Feuerlöscher'},
          {t:'p', text:'Er befindet sich in der niedrigen Holzschublade zwischen Kamin und dem Einzelsessel. Einfach den Deckel anheben.'},
          {t:'warn', text:'Der Feuerlöscher ist ein Sicherheitsgerät, das nur im echten Notfall verwendet werden darf: eine unsachgemäße Nutzung verursacht irreversible Schäden an Möbeln und Böden, deren Instandsetzungskosten vollständig dem Gast in Rechnung gestellt werden.'},
          {t:'h', text:'Nützliche Nummern'},
          {t:'p', text:'Bei jedem medizinischen, Feuer- oder öffentlichen Sicherheitsnotfall rufen Sie <b>112</b> an (einheitliche europäische Notrufnummer). Weitere Kontakte finden Sie im Bereich „Kontakte & Hilfe“.'},
          {t:'jump', to:'medical', icon:'medical', label:'Brauchen Sie einen Arzt? Siehe „Ärztlicher Dienst“'},
        ]
      },

          {t:'h', text:'Biomüll'},
          {t:'p', text:'Sie können den Biomüllbeutel frei in die braunen Tonnen am Eingang des Poliambulatorio entleeren, etwa 20 Meter von der Wohnung entfernt.'},
          {t:'img', src:'images/rifiuti-bidoni.jpg', alt:'Biomülltonnen und Sammelstelle für Restmüll', caption:'Die braunen Biomülltonnen und daneben die Sammelstelle für Restmüll, am Eingang des Poliambulatorio'},

          {t:'h', text:'Restmüll'},
          {t:'p', text:'Am selben Ort finden Sie eine gemauerte Sammelglocke für Restmüll, die mit der Karte geöffnet wird, welche Sie im Holzhalter auf dem TV-Schrank im Wohnzimmer finden.'},
          {t:'img', src:'images/rifiuti-espositore.jpg', alt:'Holzhalter mit Müllkarte und TV-Fernbedienung', caption:'Der Halter im Wohnzimmer: hier finden Sie die Müllkarte und die TV-Fernbedienung (bitte beim Check-out hier zurücklegen). Die Karte „PERCHÉ“ öffnet über einen kontaktlosen Sensor den Restmüllsammler und die Ecoisola-Tonnen. Sie muss dem Personal des Wertstoffhofs stets vorgezeigt werden.'},

          {t:'p', text:'Direkt vor dem Wertstoffhof aufgestellt, nimmt sie Papier und Karton, Leichtverpackungen und Glas auch dann an, wenn das Zentrum geschlossen ist. Sie ist nur <b>an den Schließtagen des Zentrums</b> aktiv und schaltet sich automatisch um 22 Uhr ab. Die Behälter öffnen sich mit der Müllkarte durch Auflegen auf einen kontaktlosen Sensor.'},

      parking:{
        title:'Parken & Verkehrsbeschränkung',
        blocks:[
          {t:'p', text:'Ihr reservierter, mit gelben Linien markierter Parkplatz befindet sich neben der rechten hinteren Gebäudeecke, beim Schild mit der Nummer „20“. Erreichbar, indem Sie im Uhrzeigersinn um das Gebäude gehen.'},
          {t:'img', src:'images/parcheggio-piazzola-20.jpg', alt:'Reservierter Parkplatz Nummer 20', caption:'Der reservierte Stellplatz, mit der Nummer „20“ an der Gebäudewand gekennzeichnet'},
          {t:'p', text:'Vor der Galleria gibt es weitere kostenlose, mit gelben Linien markierte Plätze ohne Nummer.'},
          {t:'link', icon:'pin', label:'Standort auf Google Maps öffnen', url:MAPS.address},
          {t:'h', text:'Verkehrsbeschränkte Zonen'},
          {t:'p', text:'In Malè (und im gesamten Val di Sole) gibt es keine dauerhaften verkehrsbeschränkten Zonen (ZTL) und keine elektronischen Zufahrtskontrollen. Jeder Ort hat Fußgängerzonen, die aber in der Regel abgesperrt sind, sodass ein versehentliches Hineinfahren praktisch unmöglich ist.'},
          {t:'h', text:'Straßensperrung im Val di Rabbi'},
          {t:'p', text:'Vom <b>27. Juni bis 6. September</b>, von 9:45 bis 17:00 Uhr, wird die Provinzstraße bei Plazze dei Forni gesperrt, wo ein großer kostenpflichtiger Parkplatz vorhanden ist. Den oberen Teil des Val di Rabbi erreichen Sie nur zu Fuß, mit dem Fahrrad oder mit den Shuttlebussen des Parks (Stelviobus).'},
          {t:'warn', text:'Hinweis: einige Linien (2‑3‑4) haben begrenzte Plätze und erfordern eine telefonische Buchung bis zum Vortag unter <a href="tel:+393466726120">346 672 6120</a>, zwischen 9:00 und 17:00 Uhr.'},
          {t:'p', text:'Wenn Sie vor 9:45 Uhr durchfahren, erreichen Sie den Parkplatz AL PLAN (ideal für die Tibetische Brücke) oder den Parkplatz COLER (für die Saent-Wasserfälle).'},
          {t:'link', icon:'bus', label:'Stelviobus-Linien und Fahrpläne (PDF)', url:'https://www.visitvaldisole.it/website_files/trasporti/Stelviobus.pdf'},
        ]

          {t:'p', text:'Sofern mit den Gastgebern nichts anderes vereinbart wurde, wird der Check-in zwischen 12:00 und 18:00 Uhr erwartet, da das Tor zur Galleria in diesem Zeitfenster geöffnet ist. Falls Sie erst nach 18:00 Uhr eintreffen, informieren Sie uns bitte: wir organisieren, dass jemand vor Ort ist, um Sie hereinzulassen. Der Check-out ist bis 10:00 Uhr erforderlich, aber falls Sie mehr Zeit benötigen, teilen Sie uns dies mit — wir tun unser Bestes, um es Ihnen zu ermöglichen.'},

        blocks:[

            address:'Pracorno di Rabbi, 3 — 38020 Rabbi (TN)',
            desc:'Die Mühle bewahrt die funktionierenden Mahlwerke und vermittelt den Besuchern die Arbeitstechniken sowie einen Einblick in die lokale Esskultur. Erhalten ist auch das Familienhaus aus dem 19. Jahrhundert mit seinen originalen Räumen und Gegenständen.',

            mapsQuery:'Molino Ruatti, Pracorno, Rabbi TN', mapsLabel:'Karte', phone:'+390463903166', phoneDisplay:'0463 903166'
          },
          {t:'place',
            name:'MMape — Bienenmuseum',
            address:'Via al Molin, 3 — 38027 Croviana (TN)',
            desc:'Ein Museum… so süß wie Honig! Aus Klängen, Düften und Geschmäckern, darunter lokaler Honig zum Probieren, begleitet von Guides, die alle Fragen zur Welt der Bienen beantworten.',

            mapsQuery:'MMape Museo dell’ape, Via al Molin 3, Croviana', mapsLabel:'Karte', phone:'+393283285780', phoneDisplay:'328 328 5780'

            address:'Via Trento 80 (loc. Pondasio) — 38027 Malè (TN)',

            mapsQuery:'Fucina Marinelli, Via Trento 80, Malè', mapsLabel:'Karte', phone:'+390463900216', phoneDisplay:'0463 900216'

      location:{

          {t:'link', icon:'pin', label:'Ouvrir l’adresse sur Google Maps', url:MAPS.address},
          {t:'h', text:'Comment venir en voiture'},
          {t:'steps', items:[
            {num:'1', title:'Sortie d’autoroute', text:'Prenez la sortie « Trento Nord – Interporto » ou « S. Michele all’Adige / Mezzocorona », sur l’<b>autoroute A22 du Brenner</b>.'},
            {num:'2', title:'Suivez les panneaux', text:'Suivez les panneaux pour Mezzolombardo, Cles, Malè (SS.42), en direction du <b>Val di Non / Val di Sole</b>.'},
            {num:'3', title:'L’immeuble Cevedale', text:'Rejoignez l’immeuble « Cevedale », au 16 Via IV Novembre à Malè (TN) — voir la carte ci-dessus.'},
            {num:'4', title:'Stationnement réservé', text:'Garez-vous à la place réservée : emplacement n° 20, sur le côté droit de l’immeuble, tout au fond (accessible en contournant l’immeuble dans le sens des aiguilles d’une montre) — détails et photos ci-dessous.'},
          ]},

          {t:'h', text:'Comment entrer'},
          {t:'p', text:'Le portail principal de la Galleria est généralement ouvert de <b>8h à 18h</b> : il suffit de le pousser pour accéder à l’escalier. En dehors de ces horaires, vous devrez utiliser les clés pour l’ouvrir.'},
          {t:'p', text:'Montez au <b>1er étage</b> (un ascenseur est également disponible), tournez à droite dans le couloir, et vous trouverez l’entrée à la deuxième porte à droite — appartement 20, sonnette « FLAMINI-GIANGRANDI ».'},

          {t:'p', text:'À côté de la porte, vous trouverez une petite boîte à clés. Ouvrez le couvercle noir vers le bas, saisissez la combinaison (qui vous sera communiquée le jour de l’arrivée), et tournez le bouton du haut dans le sens des aiguilles d’une montre.'},
          {t:'img', src:'images/cassetta-sicurezza.jpg', alt:'Instructions pour ouvrir la boîte à clés', caption:'Pour ouvrir : saisissez le code à 4 chiffres et tournez le bouton dans le sens des aiguilles d’une montre. Pour fermer : tournez dans le sens inverse et remettez la combinaison à 0‑0‑0‑0'},
          {t:'p', text:'Vous trouverez 3 clés : la plus longue ouvre la porte de l’appartement ; les deux plus courtes ouvrent le portail principal de la galerie et la porte de sortie au rez-de-chaussée sur le côté droit de l’immeuble, vers la place de parking privée (pratique pour les bagages).'},

          {t:'warn', text:'À la fin, refermez la boîte à clés, tournez le bouton dans le sens inverse des aiguilles d’une montre et remettez la combinaison à 0‑0‑0‑0. Merci de ne jamais laisser la combinaison qui vous a été communiquée visible.'},

          {t:'list', items:[

            'Remettre la carte de gestion des déchets et la télécommande TV dans le présentoir en bois',

      transport:{
        title:'Transports',
        blocks:[
          {t:'p', text:'Vous pouvez facilement vous déplacer dans le Val di Sole sans voiture : pistes cyclables, trains et bus adaptés aux vélos, navettes thématiques et lignes de bus régionales relient toute la vallée.'},
          {t:'link', icon:'bus', label:'Télécharger le livret des itinéraires & horaires (PDF)', url:'https://www.visitvaldisole.it/website_files/cataloghi/bike%2Btrain%2Bbus.pdf'},
          {t:'h', text:'Piste cyclable'},
          {t:'p', text:'Elle longe le fleuve Noce sur <b>35 km</b>, de Cogolo/Vermiglio à Mostizzolo, plus un tronçon supplémentaire de <b>3 km</b> dans le Val di Rabbi. Adaptée à toute la famille.'},
          {t:'h', text:'Bikebus'},
          {t:'p', text:'Services de bus équipés pour le transport de vélos (max 25 vélos et 5 vélos électriques), réservation obligatoire :'},
          {t:'list', items:[
            'Dimaro – Madonna di Campiglio – Carisolo : mardi, jeudi et samedi',
            'Mezzana – Fucine – Cogolo – Peio Fonti : lundi et vendredi',
            'Mezzana – Fucine – Passo Tonale : mercredi et dimanche',
          ]},
          {t:'link', icon:'key', label:'Réserver le Bikebus en ligne', url:'https://valdisole.openmove.com'},
          {t:'h', text:'Biketrain et liaisons ferroviaires'},
          {t:'p', text:'Le <b>Biketrain</b> (Mostizzolo – Mezzana) est un service quotidien train/bus équipé pour le transport de vélos (jusqu’à 80 vélos en août), sans réservation de place vélo requise.'},
          {t:'p', text:'La ligne ferroviaire locale <b>Trento – Malè – Mezzana</b> circule tous les jours. Pendant les Championnats du monde de VTT à Daolasa (27–30 août 2026), les trains circuleront toutes les 30 minutes entre Malè et Mezzana.'},
          {t:'h', text:'Navettes thématiques locales'},
          {t:'p', text:'<b>Lakebus</b> (Pellizzano – Lago dei Caprioli) : en service du 4 juillet au 30 août, réservation obligatoire. Tarif 3,00 €, réduit à 2,00 € avec la Guest Card.'},
          {t:'link', icon:'pin', label:'Arrêt Pellizzano (Parco Sama) — Google Maps', url:'https://maps.app.goo.gl/qnCEZ88Jefo7BrFy6'},
          {t:'link', icon:'key', label:'Réserver une place sur le Lakebus', url:'https://valdisole.openmove.com/'},
          {t:'p', text:'Vous pouvez aussi vous rendre au Lago dei Caprioli en voiture, jusqu’au parking situé à environ 400 mètres du lac : les places sont limitées* et doivent être réservées à l’avance. Coût : journée entière (9h00–19h00) 20 €, après-midi (12h00–19h00) 10 €.'},
          {t:'link', icon:'car', label:'Réserver une place de parking au Lago dei Caprioli', url:'https://valdisole-parkings.openmove.com/'},
          {t:'note', text:'*Si vous souhaitez rejoindre le Rifugio Alpino Fazon (<a href="tel:+393276635124">327 663 5124</a>), l’Azienda Agricola Florovivaistica Oga Casanova (<a href="tel:+393293771335">329 377 1335</a>) ou la Berry Farm (<a href="tel:+393336238830">333 623 8830</a>), contactez directement le propriétaire : il vous délivrera un accès gratuit à son parking.'},
          {t:'p', text:'<b>Summerbus</b> : en service du 25 juillet au 23 août sur les lignes Malè – Peio Fonti et Malè – Vermiglio Nord, sans réservation.'},
          {t:'p', text:'<b>Stelviobus Val di Rabbi</b> : en service du 27 juin au 6 septembre pour accéder au Parc National du Stelvio. Comprend la ligne 1 (Plazze dei Forni – Còler, toutes les 15‑30 minutes) et les lignes 2, 3 et 4 vers les refuges.'},
          {t:'note', text:'Les lignes 2, 3 et 4 ont des places limitées : réservation téléphonique la veille au plus tard, en appelant le <a href="tel:+393466726120">346 672 6120</a>, entre 9h00 et 17h00.'},
          {t:'link', icon:'bus', label:'Lignes et horaires Stelviobus (PDF)', url:'https://www.visitvaldisole.it/website_files/trasporti/Stelviobus.pdf'},
          {t:'jump', to:'parking', icon:'car', label:'Détails sur la fermeture à la circulation dans le Val di Rabbi'},
          {t:'h', text:'Lignes de bus régionales'},
          {t:'p', text:'Les lignes de bus régionales ordinaires relient Malè au Val di Rabbi (B640), à Bolentina (B641) et à Folgarida/Madonna di Campiglio (B642).'},
          {t:'p', text:'De nombreux trajets sont payants, mais gratuits ou réduits pour les titulaires de la Val di Sole Guest Card ou de la Trentino Guest Card, après validation du titre de transport.'},
          {t:'h', text:'Trentino Guest Card : transport gratuit'},
          {t:'img', src:'images/trentino-guestcard-banner.png', alt:'Trentino Guest Card'},
          {t:'p', text:'La Trentino Guest Card donne un accès illimité au réseau de transport public de Trentino Trasporti, aussi bien urbain (Trente, Rovereto, Alto Garda et Pergine) que régional. Vous pouvez également voyager sur les trains régionaux des lignes du Brenner, de la Valsugana et de Trento-Malè, sur des trajets commençant et se terminant dans la province de Trente (les trains ES, EC, IC et Espressi ne peuvent pas être utilisés).'},
          {t:'warn', text:'Pour voyager, vous devez <b>valider votre trajet</b> à chaque fois, via l’application « Mio Trentino » en scannant le QR code à bord ou en gare. Si vous n’avez pas de smartphone, vous pouvez demander une carte de transport papier aux offices de tourisme ou auprès de nous, à valider à bord ou en gare avec la Guest Card.'},

          {t:'link', icon:'pin', label:'Abrir la dirección en Google Maps', url:MAPS.address},
          {t:'h', text:'Cómo llegar en coche'},
          {t:'steps', items:[
            {num:'1', title:'Salida de autopista', text:'Tome la salida “Trento Nord – Interporto” o “S. Michele all’Adige / Mezzocorona” en la <b>autopista A22 del Brennero</b>.'},
            {num:'2', title:'Siga las indicaciones', text:'Siga las indicaciones hacia Mezzolombardo, Cles, Malè (SS.42), en dirección al <b>Val di Non / Val di Sole</b>.'},

          {t:'note', text:'<b>Si vienen desde Milán</b>, también pueden considerar la ruta Bérgamo → SS.42 → Passo del Tonale: mismo tiempo de viaje, pero sin peajes de autopista.'},

          {t:'img', src:'images/mappa-parcheggio.jpg', alt:'Mapa satelital con la ruta a la plaza de aparcamiento reservada', caption:'Ruta (en rojo) hacia la plaza reservada n.º 20; en verde las plazas gratuitas sin número'},

          {t:'p', text:'La puerta principal de la Galleria suele estar abierta de <b>8 a 18 horas</b>: basta con empujarla para acceder a las escaleras. Fuera de este horario necesitará las llaves para abrirla.'},
          {t:'p', text:'Suba a la <b>1.ª planta</b> (también hay ascensor disponible), gire a la derecha en el pasillo y encontrará la entrada en la segunda puerta a la derecha — apartamento 20, timbre “FLAMINI-GIANGRANDI”.'},

          {t:'p', text:'Junto a la puerta encontrará una pequeña caja de seguridad. Abra la tapa negra hacia abajo, introduzca la combinación (que se le comunicará el día de la llegada) y gire el pomo superior en sentido horario.'},

          {t:'p', text:'Recomendamos usar como máximo dos zonas de cocción a la vez, con una potencia combinada mostrada en la pantalla no superior a 10‑12 (por ejemplo: una zona con una olla de agua a 6‑7, una sartén con salsa a 5‑4).'},

          {t:'img', src:'images/cucina-simbolo-chiave.jpg', alt:'Símbolo con forma de llave en la placa de cocción', caption:'El símbolo de LLAVE que hay que mantener pulsado para desbloquear la placa'},

      winterActivities:{
        title:'Actividades de invierno',
        blocks:[
          {t:'p', text:'El Val di Sole en invierno ofrece mucho más que esquí: belenes repartidos por todo el pueblo, patinaje sobre hielo y mercadillos navideños dan vida al valle desde finales de noviembre hasta enero. Aquí algunos eventos que no hay que perderse.'},
